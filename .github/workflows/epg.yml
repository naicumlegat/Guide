name: Build and Deploy Guide

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download source playlists and EPG
        run: |
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us.m3u" \
            -o current-us.m3u

          curl -L --fail --retry 3 \
            "https://iptv-org.github.io/iptv/cities/usnyc.m3u" \
            -o new-york.m3u

          curl -L --fail --retry 3 \
            "https://iptv-org.github.io/iptv/cities/usbos.m3u" \
            -o boston.m3u

          curl -L --fail --retry 3 \
            "https://vcicio.github.io/US-EPG/merged_epg.xml.gz" \
            -o merged_epg.xml.gz

      - name: Build playlist and guide
        run: |
          python <<'PY'
          import gzip
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          CHANNELS = [
              "ABC",
              "CBS",
              "NBC",
              "PBS",
              "CNN",
              "USA Network",
              "TNT",
              "TBS",
              "FX",
              "FXX",
