name: Build Curated IPTV

on:
  schedule:
    - cron: "15 0,6,12,18 * * *"
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: curated-iptv
  cancel-in-progress: false

env:
  ENGINE_REPO: https://github.com/dearbulut/iptv.git

jobs:

  epg:
    name: EPG Grab
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config directory
        run: |
          mkdir -p config

      - name: Clone Dearbulut engine
        run: |
          git clone --depth 1 "$ENGINE_REPO" nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore discovered streams
        run: |
          mkdir -p nexus/config

          if [ -f config/discovered.m3u ]; then
            cp config/discovered.m3u \
              nexus/config/discovered.m3u
          else
            printf '#EXTM3U\n' > nexus/config/discovered.m3u
          fi

      - name: Configure discovered source
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("config/sources.yml")
          text = path.read_text()

          repo = os.environ["GITHUB_REPOSITORY"]

          url = (
              f"https://raw.githubusercontent.com/"
              f"{repo}/main/config/discovered.m3u"
          )

          text = text.replace(
              "https://raw.githubusercontent.com/dearbulut/iptv/main/config/discovered.m3u",
              url
          )

          path.write_text(text)
          PY

      - name: Apply channel whitelist
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aggregate/index.ts")
          text = path.read_text()

          marker = "await saveDataset(dataset);"

          whitelist = r'''
          const CURATED_NAMES = new Set([
            "nbc",
            "cbs",
            "abc",
            "fox",
            "pbs",
            "game show network",
            "history",
            "discovery",
            "amc",
            "fx",
            "syfy",
            "comedy central",
            "paramount",
            "paramount network",
            "mtv",
            "freeform",
            "hallmark movies & more",
            "hgtv",
            "bravo",
            "e!",
            "lifetime",
            "disney channel",
            "nickelodeon",
            "cartoon network",
            "fxx",
            "hbo",
            "hbo hits",
            "hbo movies",
            "starz",
            "starz cinema",
            "starz comedy",
            "cinemax",
            "showtime",
            "a&e",
            "bloomberg tv",
            "documentary+",
            "paramount+ picks",
            "paramount movie channel",
            "the jamie oliver channel",
            "the nanny"
          ]);

          const normalizeCuratedName = (value: string): string =>
            value
              .trim()
              .toLowerCase()
              .replace(/\s+/g, " ");

          dataset.channels = dataset.channels.filter((channel) => {
            const names = [
              channel.name,
              ...channel.alt_names,
            ].map(normalizeCuratedName);

            const isCurated = names.some((name) =>
              CURATED_NAMES.has(name)
            );

            if (!isCurated) return false;

            if (names.includes("hgtv")) return true;

            return channel.country === "US";
          });

          dataset.orphans = [];

          log.info(
            `Curated US whitelist: ${dataset.channels.length} channel(s)`
          );
          '''

          if "const CURATED_NAMES = new Set([" in text:
              print("Whitelist already patched")
              raise SystemExit(0)

          if marker not in text:
              raise SystemExit(
                  "Could not locate aggregate save marker"
              )

          text = text.replace(
              marker,
              whitelist + "\n          " + marker,
              1
          )

          path.write_text(text)
          PY

      - name: Install Dearbulut dependencies
        working-directory: nexus
        run: |
          npm ci

      - name: Aggregate curated channel dataset
        working-directory: nexus
        run: |
          npm run cli -- aggregate

      - name: Clone iptv-org EPG grabber
        run: |
          git clone --depth 1 -b master \
            https://github.com/iptv-org/epg.git epg

      - name: Install EPG dependencies
        working-directory: epg
        run: |
          npm install --no-audit --no-fund

      - name: Build curated EPG channel list
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          dataset_path = Path("nexus/.data/channels.json")
          output_path = Path("epg/curated.channels.xml")

          if not dataset_path.exists():
              raise SystemExit(
                  f"Missing curated dataset: {dataset_path}"
              )

          dataset = json.loads(dataset_path.read_text())

          root = ET.Element("channels")

          seen = set()
          channel_count = 0
          guide_count = 0

          for channel in dataset.get("channels", []):
              channel_id = str(channel.get("id", "")).strip()

              if not channel_id:
                  continue

              channel_count += 1

              for guide in channel.get("guides", []):
                  site = str(guide.get("site", "")).strip()
                  site_id = str(guide.get("site_id", "")).strip()
                  lang = str(guide.get("lang", "")).strip()
                  xmltv_id = channel_id

                  if not site or not site_id:
                      continue

                  key = (
                      site.lower(),
                      site_id.lower(),
                      lang.lower(),
                      xmltv_id.lower(),
                  )

                  if key in seen:
                      continue

                  seen.add(key)

                  element = ET.SubElement(
                      root,
                      "channel",
                      {
                          "site": site,
                          "site_id": site_id,
                          "lang": lang or "en",
                          "xmltv_id": xmltv_id,
                      },
                  )

                  element.text = channel.get(
                      "name",
                      channel_id
                  )

                  guide_count += 1

          try:
              ET.indent(root, space="  ")
          except AttributeError:
              pass

          tree = ET.ElementTree(root)

          tree.write(
              output_path,
              encoding="utf-8",
              xml_declaration=True,
          )

          print()
          print("========================================")
          print("CURATED EPG CHANNEL LIST")
          print("========================================")
          print(f"Curated Nexus channels: {channel_count}")
          print(f"Guide mappings kept: {guide_count}")
          print(f"Output: {output_path}")
          print("========================================")
          PY

          echo
          echo "EPG channel count:"
          grep -c '<channel ' epg/curated.channels.xml || true

          echo
          echo "First EPG entries:"
          grep '<channel ' epg/curated.channels.xml \
            | head -30 || true

      - name: Grab curated EPG
        run: |
          set -e

          mkdir -p guides

          rm -f epg/guide.xml
          rm -f epg/guide.xml.gz

          (
            cd epg

            npm run grab -- \
              --channels=curated.channels.xml \
              --output=guide.xml \
              --days=3 \
              --timeout=30000 \
              --maxConnections=8 \
              --gzip
          ) || true

          if [ ! -s epg/guide.xml ]; then
            echo "No guide produced"
            exit 0
          fi

          programmes=$(grep -c '<programme' epg/guide.xml || true)

          if [ "${programmes:-0}" -lt 1 ]; then
            echo "No programmes produced"
            exit 0
          fi

          if [ -f epg/guide.xml.gz ]; then
            cp epg/guide.xml.gz \
              guides/curated.xml.gz
          else
            gzip -9 -c epg/guide.xml > \
              guides/curated.xml.gz
          fi

          echo
          echo "========================================"
          echo "CURATED EPG COMPLETE"
          echo "========================================"
          echo "Programmes: $programmes"
          echo "Output: guides/curated.xml.gz"
          echo "========================================"

      - name: Publish EPG state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: nexus
        run: |
          cp -R ../guides ./guides

          chmod +x scripts/publish-state.sh

          ./scripts/publish-state.sh \
            "epg: $(date -u +%FT%TZ)" \
            guides/:epg/

  discovery:
    name: Discover Streams
    if: >
      github.event_name == 'workflow_dispatch' ||
