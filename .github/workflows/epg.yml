      - name: Configure discovered source
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("config/sources.yml")
          text = path.read_text()

          repo = os.environ["GITHUB_REPOSITORY"]

          url = (
              f"https://raw.githubusercontent.com/"
              f"{repo}/main/config/discovered.m3u"
          )

          text = text.replace(
              "https://raw.githubusercontent.com/dearbulut/iptv/main/config/discovered.m3u",
              url
          )

          path.write_text(text)
          PY

      - name: Apply channel whitelist
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aggregate/index.ts")
          text = path.read_text()

          marker = "await saveDataset(dataset);"

          whitelist = r'''
          const CURATED_NAMES = new Set([
            "nbc",
            "cbs",
            "abc",
            "fox",
            "pbs",
            "game show network",
            "history",
            "discovery",
            "amc",
            "fx",
            "syfy",
            "comedy central",
            "paramount",
            "paramount network",
            "mtv",
            "freeform",
            "hallmark movies & more",
            "hgtv",
            "bravo",
            "e!",
            "lifetime",
            "disney channel",
            "nickelodeon",
            "cartoon network",
            "fxx",
            "hbo",
            "hbo hits",
            "hbo movies",
            "starz",
            "starz cinema",
            "starz comedy",
            "cinemax",
            "showtime",
            "a&e",
            "bloomberg tv",
            "documentary+",
            "paramount+ picks",
            "paramount movie channel",
            "the jamie oliver channel",
            "the nanny"
          ]);

          const normalizeCuratedName = (value: string): string =>
            value
              .trim()
              .toLowerCase()
              .replace(/\s+/g, " ");

          dataset.channels = dataset.channels.filter((channel) => {
            const names = [
              channel.name,
              ...channel.alt_names,
            ].map(normalizeCuratedName);

            const isCurated = names.some((name) =>
              CURATED_NAMES.has(name)
            );

            if (!isCurated) return false;

            if (names.includes("hgtv")) return true;

            return channel.country === "US";
          });

          dataset.orphans = [];

          log.info(
            `Curated US whitelist: ${dataset.channels.length} channel(s)`
          );
          '''

          if "const CURATED_NAMES = new Set([" in text:
              print("Whitelist already patched")
              raise SystemExit(0)

          if marker not in text:
              raise SystemExit(
                  "Could not locate aggregate save marker"
              )

          text = text.replace(
              marker,
              whitelist + "\n          " + marker,
              1
          )

          path.write_text(text)
          PY

      - name: Restore discovery rejection memory
        working-directory: nexus
        run: |
          mkdir -p .data

          git fetch origin state:state --depth=1 2>/dev/null || true

          git show state:discovery.json \
            > .data/discovery.json 2>/dev/null || true

      - name: Install dependencies
        working-directory: nexus
        run: |
          npm ci

      - name: Verify ffprobe
        run: |
          ffprobe -version | head -1

      - name: Aggregate curated dataset
        working-directory: nexus
        run: |
          npm run cli -- aggregate

      - name: Discover and verify replacements
        working-directory: nexus
        run: |
          npm run cli -- discover \
            --max-probes 800 \
            --apply

      - name: Copy discovered streams back
        run: |
          mkdir -p config

          cp nexus/config/discovered.m3u \
            config/discovered.m3u

      - name: Commit discovered streams
        run: |
          if git diff --quiet -- config/discovered.m3u; then
            echo "No new discovered streams"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/discovered.m3u

          git commit \
            -m "discovery: update curated streams"

          git pull --rebase --quiet origin main || true

          git push origin HEAD:main

      - name: Persist discovery rejection memory
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: nexus
        run: |
          if [ ! -f .data/discovery.json ]; then
            exit 0
          fi

          chmod +x scripts/publish-state.sh

          ./scripts/publish-state.sh \
            "discovery: $(date -u +%FT%TZ)" \
            .data/discovery.json:discovery.json

  health:
    name: Health Scan
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 3,15 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config directory
        run: |
          mkdir -p config

      - name: Clone Dearbulut engine
        run: |
          git clone --depth 1 "$ENGINE_REPO" nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
