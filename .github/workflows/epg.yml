                      "WPIX The CW New York",
                      "http://encodercdn1.frontline.ca/kamino/output/pix11_720p/playlist.m3u8"
                  ),
                  (
                      "WPIX.us",
                      "WPIX The CW New York",
                      "https://encodercdn1.frontline.ca/kamino/output/pix11_720p/playlist.m3u8"
                  ),
              ],

              "CNBC": [
                  (
                      "CNBC.us@East",
                      "CNBC East",
                      "http://41.205.93.154/CNBC/index.m3u8"
                  ),
                  (
                      "CNBC.us@East",
                      "CNBC East",
                      "http://143.244.60.30/CNBC/index.m3u8"
                  ),
                  (
