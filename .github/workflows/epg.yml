            "e!",
            "lifetime",
            "disney channel",
            "nickelodeon",
            "cartoon network",
            "fxx",
            "hbo",
            "hbo hits",
            "hbo movies",
            "starz",
            "starz cinema",
            "starz comedy",
            "cinemax",
