  health-merge:
    name: Merge Health
    needs: health
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Dearbulut engine
        run: git clone --depth 1 "$ENGINE_REPO" nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download health shards
        uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: health-shard-*

      - name: Merge health databases
        working-directory: nexus
        run: |
          mkdir -p .data
          node scripts/merge-health.mjs \
            ../shards \
            .data/health.json

      - name: Publish health state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: nexus
        run: |
          test -f .data/health.json

          chmod +x scripts/publish-state.sh

          for attempt in 1 2 3 4 5; do
            echo "Publishing health state, attempt $attempt"

            if ./scripts/publish-state.sh \
              "health: $(date -u +%FT%TZ)" \
              .data/health.json:health.json; then
              echo "Health state published successfully"
              exit 0
            fi

            echo "State branch changed during publish"

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 3))
              git fetch origin state:state --force
            fi
          done

          echo "Failed to publish health state after 5 attempts"
          exit 1

  sync:
    name: Sync and Deploy
    needs:
      - epg
      - discovery
      - health-merge
    if: >
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.schedule == '15 0,6,12,18 * * *'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config directory
        run: mkdir -p config

      - name: Clone Dearbulut engine
        run: git clone --depth 1 "$ENGINE_REPO" nexus

      - name: Preserve stream feed identity
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aggregate/sources.ts")
          text = path.read_text()

          if "function splitChannelFeed(" not in text:
              marker = "interface JsonStreamShape {"

              helper = r'''
          function splitChannelFeed(value: string | null): {
            channel: string | null;
            feed: string | null;
          } {
            const valueTrimmed = value?.trim() ?? "";

            if (!valueTrimmed) {
              return {
                channel: null,
                feed: null,
              };
            }

            const at = valueTrimmed.indexOf("@");

            if (at <= 0 || at === valueTrimmed.length - 1) {
              return {
                channel: valueTrimmed,
                feed: null,
              };
            }

            return {
              channel: valueTrimmed.slice(0, at),
              feed: valueTrimmed.slice(at + 1),
            };
          }

          '''

              if marker not in text:
                  raise SystemExit(
                      "Could not locate sources.ts insertion point"
                  )

              text = text.replace(marker, helper + marker, 1)

          old = """      const title = entry.title ?? entry.name ?? '';
          push({
            channel: entry.channel ?? entry.tvg_id ?? null,
            feed: entry.feed ?? null,"""

          new = """      const identity = splitChannelFeed(
            entry.channel ?? entry.tvg_id ?? null
          );

          push({
            channel: identity.channel,
            feed: entry.feed ?? identity.feed,"""

          if old in text:
              text = text.replace(old, new, 1)

          old = """      const tvgId = entry.attributes['tvg-id']?.trim() || null;
          const title = entry.title || entry.attributes['tvg-name'] || '';
          push({
            channel: tvgId,
            feed: null,"""

          new = """      const tvgId = entry.attributes['tvg-id']?.trim() || null;
          const identity = splitChannelFeed(tvgId);
          const title = entry.title || entry.attributes['tvg-name'] || '';

          push({
            channel: identity.channel,
            feed: identity.feed,"""

          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Restore state
