              ],

              "Paramount Network": [
                  (
                      "ParamountNetwork.us@East",
                      "Paramount Network East",
                      "https://fl1.moveonjoy.com/PARAMOUNT_NETWORK/index.m3u8"
                  ),
              ],

              "Disney Channel": [
                  (
                      "DisneyChannel.us@East",
                      "Disney Channel East",
                      "https://e3.thetvapp.to/hls/DisneyChannelEast/index.m3u8"
                  ),
              ],

              "Comedy Central": [
                  (
                      "ComedyCentral.us@East",
                      "Comedy Central East",
                      "http://23.237.104.106:8080/USA_COMEDY_CENTRAL/index.m3u8"
                  ),
              ],

              "TCM": [
                  (
                      "TCM.us@East",
                      "TCM East",
                      "http://main.light-ott.net:80/play/live.php?mac=A0:BB:3E:00:01:FC&stream=855460&extension=ts"
                  ),
              ],

              "Hallmark Channel": [
                  (
                      "HallmarkChannel.us@East",
                      "Hallmark Channel East",
                      "http://23.237.104.106:8080/USA_HALLMARK/index.m3u8"
                  ),
                  (
                      "HallmarkChannel.us@East",
                      "Hallmark Channel East",
                      "http://40.160.24.53/HALLMARK/index.m3u8"
                  ),
              ],

              "AMC": [
                  (
                      "AMC.us@East",
                      "AMC East",
                      "https://fl1.moveonjoy.com/AMC_NETWORK/index.m3u8"
                  ),
              ],

              "HGTV": [
                  (
                      "HGTV.us@East",
                      "HGTV East",
                      "http://212.102.60.231/HGTV/index.m3u8"
                  ),
              ],
          }

          CHANNELS = [
              ("ABC", "ABC", "Broadcast"),
              ("CBS", "CBS", "Broadcast"),
              ("NBC", "NBC", "Broadcast"),
              ("The CW", "The CW", "Broadcast"),
              ("PBS", "PBS", "Broadcast"),
              ("CNN", "CNN", "News"),
              ("CNBC", "CNBC", "News"),
              ("ESPN", "ESPN", "Sports"),
              ("ESPN2", "ESPN2", "Sports"),
              ("USA Network", "USA Network", "Entertainment"),
              ("TNT", "TNT", "Entertainment"),
              ("TBS", "TBS", "Entertainment"),
              ("FX", "FX", "Entertainment"),
              ("FXX", "FXX", "Entertainment"),
              ("Paramount Network", "Paramount Network", "Entertainment"),
              ("Syfy", "Syfy", "Entertainment"),
              ("Bravo", "Bravo", "Entertainment"),
              ("E!", "E!", "Entertainment"),
              ("Freeform", "Freeform", "Entertainment"),
              ("Disney Channel", "Disney Channel", "Kids"),
              ("Nickelodeon", "Nickelodeon", "Kids"),
              ("Cartoon Network", "Cartoon Network", "Kids"),
              ("Comedy Central", "Comedy Central", "Comedy"),
              ("TCM", "TCM", "Movies"),
              ("Hallmark Channel", "Hallmark Channel", "Movies"),
              ("AMC", "AMC", "Movies"),
              ("HGTV", "HGTV", "Lifestyle"),
              ("Game Show Network", "Game Show Network", "Entertainment"),
          ]

          REQUIRED_IDS = {
              "ABC": {"WABCTV.us"},
              "CBS": {"CBS.us@East"},
              "NBC": {"NBC.us@East"},
              "The CW": {"WPIX.us"},
              "CNBC": {"CNBC.us@East"},
              "ESPN": {"ESPN.us"},
              "ESPN2": {"ESPN2.us"},
              "TNT": {"TNT.us@East"},
              "TBS": {"TBS.us@East"},
              "FXX": {"FXX.us@East"},
              "Paramount Network": {"ParamountNetwork.us@East"},
              "Disney Channel": {"DisneyChannel.us@East"},
              "Comedy Central": {"ComedyCentral.us@East"},
              "TCM": {"TCM.us@East"},
              "Hallmark Channel": {"HallmarkChannel.us@East"},
              "AMC": {"AMC.us@East"},
              "HGTV": {"HGTV.us@East"},
          }

          FORBIDDEN = {
              "ABC": {
                  "ABCNews.us@East",
                  "ABCNewsLive.us@SD",
              },
              "The CW": {
                  "NationalGeographicWild.us@East",
                  "NationalGeographicWild.us@HDEast",
                  "NationalGeographic.us@East",
              },
              "Hallmark Channel": {
                  "HallmarkFamily.us@East",
                  "HallmarkMystery.us@East",
                  "HallmarkMoviesMysteries.us@East",
              },
          }

          def fetch(url, timeout=15):
              req = urllib.request.Request(url, headers=HEADERS)
              return urllib.request.urlopen(req, timeout=timeout)

          def test_stream(url):
              try:
                  with fetch(url) as r:
                      status = getattr(r, "status", 200)
                      content_type = (r.headers.get("Content-Type") or "").lower()
                      data = r.read(32768)

                      if status < 200 or status >= 400:
                          return False, f"HTTP {status}"

                      if not data:
                          return False, "empty response"

                      text = data.decode("utf-8", errors="ignore")

                      if b"#EXTM3U" in data:
                          if "#EXTINF:" in text or "#EXT-X-STREAM-INF:" in text:
                              return True, f"HLS {status} {content_type}"

                          return False, "HLS playlist has no media entries"

                      if (
                          "video" in content_type
                          or "mpeg" in content_type
                          or "octet-stream" in content_type
                          or url.lower().endswith(".ts")
                      ):
                          return True, f"media {status} {content_type}"

                      if len(data) >= 1024 and not text.lstrip().lower().startswith(
                          ("<html", "<!doctype", "<head")
                      ):
                          return True, f"binary {status} {content_type}"

                      return False, f"not a stream ({content_type})"

              except Exception as e:
                  return False, str(e)

          def identity_allowed(channel, stream_id):
              if stream_id in FORBIDDEN.get(channel, set()):
                  return False

              allowed = REQUIRED_IDS.get(channel)

              if allowed is not None and stream_id not in allowed:
                  return False

              return True

          def find_in_m3u(path, channel):
              results = []

              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  lines = [x.rstrip("\n") for x in f]

              for i, line in enumerate(lines):
                  if not line.startswith("#EXTINF"):
                      continue

                  m_id = re.search(r'tvg-id="([^"]*)"', line)

                  if not m_id or i + 1 >= len(lines):
                      continue

                  stream_id = m_id.group(1)
                  url = lines[i + 1].strip()

                  if not url.startswith(("http://", "https://")):
                      continue

                  if not identity_allowed(channel, stream_id):
                      continue

                  results.append((stream_id, line, url))

              return results

          verified = {}

          print("")
          print("=" * 60)
          print("STRICT VERIFIED STREAM SELECTION")
          print("=" * 60)

          for channel, display_name, group in CHANNELS:

              if channel in FROZEN:
                  stream_id, url = FROZEN[channel]
                  verified[channel] = (stream_id, url)

                  print(f"FROZEN: {channel}")
                  print(f"        {url}")
                  continue

              candidates = []

              for source in ("current-us.m3u", "new-york.m3u", "boston.m3u"):
                  for item in find_in_m3u(source, channel):
                      if item not in candidates:
                          candidates.append(item)

              for stream_id, identity_name, url in CANDIDATES.get(channel, []):
                  if not identity_allowed(channel, stream_id):
                      continue

                  item = (
                      stream_id,
                      f"#EXTINF:-1,{identity_name}",
                      url
                  )

                  if item not in candidates:
                      candidates.append(item)

              found = None

              for stream_id, identity_name, url in candidates:

                  if not identity_allowed(channel, stream_id):
                      print(f"REJECTED IDENTITY: {channel}")
                      print(f"                 {stream_id}")
                      continue

                  ok, reason = test_stream(url)

                  if ok:
                      found = (stream_id, url)

                      print(f"VERIFIED: {channel}")
                      print(f"          ID:  {stream_id}")
                      print(f"          URL: {url}")
                      print(f"          TEST: {reason}")

                      break

                  print(f"FAILED: {channel}")
                  print(f"        ID:  {stream_id}")
                  print(f"        URL: {url}")
                  print(f"        TEST: {reason}")

              if found is None:
                  print("")
                  print(f"ERROR: No verified stream found for {channel}")
                  print("The workflow will NOT substitute an unrelated channel.")
                  sys.exit(1)

              verified[channel] = found

          with open("public/channels.m3u", "w", encoding="utf-8") as out:
              out.write("#EXTM3U\n")

              for channel, display_name, group in CHANNELS:
                  stream_id, url = verified[channel]

                  out.write(
                      f'#EXTINF:-1 tvg-id="{stream_id}" '
                      f'group-title="{group}",{display_name}\n'
                  )
                  out.write(url + "\n")

          print("")
          print("=" * 60)
          print("FINAL PLAYLIST")
          print("=" * 60)

          with open("public/channels.m3u", "r", encoding="utf-8") as f:
              print(f.read())
          PY

      - name: Download current US EPG
        run: |
          curl -L --fail \
            "https://vcicio.github.io/US-EPG/merged_epg.xml.gz" \
            -o epg.xml.gz

          test -s epg.xml.gz
          ls -lh epg.xml.gz

      - name: Build filtered EPG
        run: |
          python <<'PY'
          import gzip
          import re
          import xml.etree.ElementTree as ET

          PLAYLIST = "public/channels.m3u"
          SOURCE = "epg.xml.gz"
          OUTPUT = "public/guide.xml"

          CHANNELS = [
              "ABC",
              "CBS",
              "NBC",
              "The CW",
              "PBS",
              "CNN",
              "CNBC",
              "ESPN",
              "ESPN2",
              "USA Network",
              "TNT",
              "TBS",
              "FX",
              "FXX",
              "Paramount Network",
              "Syfy",
              "Bravo",
              "E!",
              "Freeform",
              "Disney Channel",
              "Nickelodeon",
              "Cartoon Network",
              "Comedy Central",
              "TCM",
              "Hallmark Channel",
              "AMC",
              "HGTV",
              "Game Show Network",
          ]

          GUIDE_IDS = {
              "ABC": ["WABCTV.us"],
              "CBS": ["CBS.us@East"],
              "NBC": ["NBC.us@East"],
              "The CW": ["WPIX.us"],
              "PBS": ["PBS.us@KQED"],
              "CNN": ["CNN.us@East"],
              "CNBC": ["CNBC.us@East"],
              "ESPN": ["ESPN.us"],
              "ESPN2": ["ESPN2.us"],
              "USA Network": ["USA.us@East"],
              "TNT": ["TNT.us@East"],
              "TBS": ["TBS.us@East"],
              "FX": ["FX.us@East"],
              "FXX": ["FXX.us@East"],
              "Paramount Network": ["ParamountNetwork.us@East"],
              "Syfy": ["SYFY.us@East"],
              "Bravo": ["Bravo.us@East"],
              "E!": ["E.us@East"],
              "Freeform": ["Freeform.us@East"],
              "Disney Channel": ["DisneyChannel.us@East"],
              "Nickelodeon": ["Nickelodeon.us@East"],
              "Cartoon Network": ["CartoonNetwork.us@East"],
              "Comedy Central": ["ComedyCentral.us@East"],
              "TCM": ["TCM.us@East"],
              "Hallmark Channel": ["HallmarkChannel.us@East"],
              "AMC": ["AMC.us@East"],
              "HGTV": ["HGTV.us@East"],
              "Game Show Network": ["GameShowNetwork.us@SD"],
          }

          with open(PLAYLIST, "r", encoding="utf-8") as f:
              lines = [x.rstrip("\n") for x in f]

          playlist_channels = []

          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF"):
                  continue

              if i + 1 >= len(lines):
                  continue

              m_id = re.search(r'tvg-id="([^"]*)"', line)
              m_name = re.search(r',(.+)$', line)

              if m_id and m_name:
                  playlist_channels.append(
                      (
                          m_name.group(1).strip(),
                          m_id.group(1).strip()
                      )
                  )

          with gzip.open(SOURCE, "rb") as f:
              root = ET.parse(f).getroot()

          source_channel_ids = {
              c.attrib.get("id", "")
              for c in root.findall("channel")
          }

          selected_ids = set()

          for channel_name in CHANNELS:
              candidates = GUIDE_IDS.get(channel_name, [])

              for candidate in candidates:
                  if candidate in source_channel_ids:
                      selected_ids.add(candidate)
                      print(f"EPG: {channel_name} -> {candidate}")
                      break
              else:
                  print(f"EPG MISSING: {channel_name}")

          new_root = ET.Element(
              "tv",
              {
                  "generator-info-name": "Custom TiviMate Guide"
              }
          )

          for channel in root.findall("channel"):
              cid = channel.attrib.get("id", "")

              if cid in selected_ids:
                  new_root.append(channel)

          for programme in root.findall("programme"):
              cid = programme.attrib.get("channel", "")

              if cid in selected_ids:
                  new_root.append(programme)

          tree = ET.ElementTree(new_root)

          try:
              ET.indent(tree, space="  ")
          except AttributeError:
              pass

          tree.write(
              OUTPUT,
              encoding="utf-8",
              xml_declaration=True
          )

          print("")
          print("Filtered EPG created.")
          PY

      - name: Validate generated files
        run: |
          test -s public/channels.m3u
          test -s public/guide.xml

          CHANNEL_COUNT=$(grep -c '^#EXTINF' public/channels.m3u || true)
          PROGRAM_COUNT=$(grep -c '<programme ' public/guide.xml || true)
          GUIDE_CHANNEL_COUNT=$(grep -c '<channel ' public/guide.xml || true)

          echo "Playlist channels: $CHANNEL_COUNT"
          echo "Guide channels:    $GUIDE_CHANNEL_COUNT"
          echo "EPG programmes:    $PROGRAM_COUNT"

          if [ "$CHANNEL_COUNT" -ne 28 ]; then
            echo "ERROR: Expected exactly 28 playlist channels."
            exit 1
          fi

          if ! grep -q '<tv' public/guide.xml; then
            echo "ERROR: guide.xml is not valid XMLTV."
            exit 1
          fi

          if [ "$PROGRAM_COUNT" -lt 1 ]; then
            echo "ERROR: guide.xml contains no programmes."
            exit 1
          fi

          if grep -qi '^#EXTINF.*FOX' public/channels.m3u; then
            echo "ERROR: FOX is still present in the playlist."
            exit 1
          fi

          if grep -qi 'Fox News\|Fox Deportes\|Fox Business\|Fox Weather' public/channels.m3u; then
            echo "ERROR: Invalid FOX-branded channel detected."
            exit 1
          fi

          if grep -qi 'natgeo\|nationalgeographic' public/channels.m3u; then
            echo "ERROR: Unrelated National Geographic stream detected."
            exit 1
          fi

          echo "Validation passed."

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lh public/

          echo
          echo "Playlist:"
          cat public/channels.m3u

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
