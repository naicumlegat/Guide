name: Build and Deploy Guide

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Create public directory
        run: |
          rm -rf public
          mkdir -p public

      - name: Download current US EPG
        run: |
          curl -L --fail \
            "https://vcicio.github.io/US-EPG/merged_epg.xml.gz" \
            -o epg.xml.gz

          ls -lh epg.xml.gz

      - name: Build filtered EPG
        run: |
          python <<'PY'
          import gzip
          import xml.etree.ElementTree as ET

          source = "epg.xml.gz"
          output = "public/guide.xml"

          wanted = {
              "ABC.us@East",
              "CBS.us@East",
              "NBC.us@East",
              "Fox.us@East",
              "TheCW.us@SD",
              "PBS.us@KQED",
              "CNN.us@East",
              "FoxNewsChannel.us@SD",
              "CNBC.us@East",
              "ESPN.us",
              "ESPN2.us",
              "USA.us@East",
              "TNT.us@East",
              "TBS.us@East",
              "FX.us@East",
              "FXX.us@East",
              "ParamountNetwork.us@East",
              "SYFY.us@East",
              "Bravo.us@East",
              "E.us@East",
              "Freeform.us@East",
              "DisneyChannel.us@East",
              "Nickelodeon.us@East",
              "CartoonNetwork.us@East",
              "ComedyCentral.us@East",
              "TCM.us@East",
              "HallmarkChannel.us@East",
              "AMC.us@East",
              "GameShowNetwork.us@East",
              "HGTV.us@East",
          }

          # Read the complete public XMLTV feed.
          with gzip.open(source, "rb") as f:
              tree = ET.parse(f)

          root = tree.getroot()

          # Keep only the channels whose XMLTV IDs match our playlist.
          kept_ids = set()

          for channel in list(root.findall("channel")):
              channel_id = channel.get("id")

              if channel_id in wanted:
                  kept_ids.add(channel_id)
              else:
                  root.remove(channel)

          # Remove programmes belonging to channels we did not keep.
          programme_count = 0

          for programme in list(root.findall("programme")):
              channel_id = programme.get("channel")

              if channel_id in kept_ids:
                  programme_count += 1
              else:
                  root.remove(programme)

          tree.write(output, encoding="utf-8", xml_declaration=True)

          print("Requested channels:", len(wanted))
          print("Matched channels:", len(kept_ids))
          print("Programme entries:", programme_count)

          if not kept_ids:
              raise SystemExit("ERROR: No playlist channel IDs were found in the EPG.")

          if programme_count == 0:
              raise SystemExit("ERROR: No programme entries were found.")

          print("Matched channel IDs:")
          for channel_id in sorted(kept_ids):
              print("  " + channel_id)
          PY

      - name: Validate EPG
        run: |
          test -s public/guide.xml

          if ! grep -q "<tv" public/guide.xml; then
            echo "ERROR: guide.xml is not a valid XMLTV document."
            exit 1
          fi

          PROGRAM_COUNT=$(grep -c "<programme " public/guide.xml || true)

          echo "EPG programme entries: $PROGRAM_COUNT"

          if [ "$PROGRAM_COUNT" -lt 1 ]; then
            echo "ERROR: guide.xml contains no programme entries."
            exit 1
          fi

      - name: Copy playlist
        run: |
          if [ ! -f channels.m3u ]; then
            echo "ERROR: channels.m3u was not found."
            exit 1
          fi

          cp channels.m3u public/channels.m3u

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lh public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
