          http://main.light-ott.net:80/play/live.php?mac=A0:BB:3E:00:01:FC&stream=855460&extension=ts

          #EXTINF:-1 tvg-id="HallmarkChannel.us@East" group-title="Movies",Hallmark Channel
          http://23.237.104.106:8080/USA_HALLMARK/index.m3u8

          #EXTINF:-1 tvg-id="AMC.us@East" group-title="Movies",AMC
          https://fl1.moveonjoy.com/AMC_NETWORK/index.m3u8

          #EXTINF:-1 tvg-id="HGTV.us@East" group-title="Lifestyle",HGTV
          http://212.102.60.231/HGTV/index.m3u8

          #EXTINF:-1 tvg-id="GameShowNetwork.us@East" group-title="Entertainment",Game Show Network
          https://a-cdn.klowdtv.com/live2/gsn_720p/playlist.m3u8
          EOF

          echo "Created public/channels.m3u"
          echo "Channel count:"
          grep -c '^#EXTINF' public/channels.m3u

      - name: Download current US EPG
        run: |
          curl -L --fail \
            "https://vcicio.github.io/US-EPG/merged_epg.xml.gz" \
            -o epg.xml.gz

          test -s epg.xml.gz
          ls -lh epg.xml.gz

      - name: Build filtered EPG
        run: |
          python <<'PY'
          import gzip
          import re
          import xml.etree.ElementTree as ET

          SOURCE = "epg.xml.gz"
          OUTPUT = "public/guide.xml"

          channels = {
              "ABC.us@East": ["ABC"],
              "CBS.us@East": ["CBS"],
              "NBC.us@East": ["NBC"],
              "Fox.us@East": ["FOX"],
              "TheCW.us@SD": ["THE CW", "CW"],
              "PBS.us@KQED": ["PBS"],
              "CNN.us@East": ["CNN"],
              "FoxNewsChannel.us@SD": ["FOX NEWS", "FOX NEWS CHANNEL"],
              "CNBC.us@East": ["CNBC"],
              "ESPN.us": ["ESPN"],
              "ESPN2.us": ["ESPN2", "ESPN 2"],
              "USA.us@East": ["USA NETWORK"],
              "TNT.us@East": ["TNT"],
              "TBS.us@East": ["TBS"],
              "FX.us@East": ["FX"],
              "FXX.us@East": ["FXX"],
              "ParamountNetwork.us@East": ["PARAMOUNT NETWORK"],
              "SYFY.us@East": ["SYFY"],
              "Bravo.us@East": ["BRAVO"],
              "E.us@East": ["E!"],
              "Freeform.us@East": ["FREEFORM"],
              "DisneyChannel.us@East": ["DISNEY CHANNEL"],
              "Nickelodeon.us@East": ["NICKELODEON"],
              "CartoonNetwork.us@East": ["CARTOON NETWORK"],
              "ComedyCentral.us@East": ["COMEDY CENTRAL"],
              "TCM.us@East": ["TURNER CLASSIC MOVIES", "TCM"],
              "HallmarkChannel.us@East": ["HALLMARK CHANNEL", "HALLMARK"],
              "AMC.us@East": ["AMC"],
              "GameShowNetwork.us@East": ["GAME SHOW NETWORK", "GSN"],
              "HGTV.us@East": ["HGTV"],
          }

          def normalize(value):
              value = value or ""
              value = value.upper()
              value = value.replace("&AMP;", "AND")
              value = re.sub(r"[^A-Z0-9!]+", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def get_names(channel):
              names = []

              for node in channel.findall("display-name"):
                  if node.text:
                      names.append(normalize(node.text))

              return names

          def score_candidate(candidate, aliases):
              channel_id_raw = candidate["id"]
              channel_id = normalize(channel_id_raw)
              names = candidate["names"]
              combined = " ".join([channel_id] + names)

              # Reject non-Eastern feeds.
              forbidden = [
                  "PACIFIC",
                  "WESTERN",
                  "WEST FEED",
                  "MOUNTAIN",
                  "CENTRAL FEED",
                  "MIDWEST",
              ]

              for word in forbidden:
                  if word in combined:
                      return 0

              # Reject US2 sources. This check is performed after
              # normalization, so ".us2" becomes "US2".
              if re.search(r"\bUS2\b", channel_id):
                  return 0

              # Never use AMC+ as AMC.
              if "AMC+" in combined or "AMC PLUS" in combined:
                  return 0

              score = 0

              for name in names:
                  for alias in aliases:
                      if name == alias:
                          score = max(score, 1000)
                      elif name.startswith(alias + " "):
                          score = max(score, 800)
                      elif alias in name:
                          score = max(score, 500)

              if score == 0:
                  return 0

              # Prefer Eastern feeds.
              for term in [
                  "EASTERN",
                  "EAST",
                  "EAST FEED",
              ]:
                  if term in combined:
                      score += 300

              # Prefer US1.
              if re.search(r"\bUS1\b", channel_id):
                  score += 250

              return score

          with gzip.open(SOURCE, "rb") as f:
              tree = ET.parse(f)

          root = tree.getroot()

          source_channels = []

          for channel in root.findall("channel"):
              source_channels.append({
                  "element": channel,
                  "id": channel.get("id", ""),
                  "names": get_names(channel)
              })

          selected = {}
          used_source_ids = set()

          for target_id, aliases in channels.items():
              aliases = [normalize(alias) for alias in aliases]

              best = None
              best_score = 0

              for candidate in source_channels:
                  if candidate["id"] in used_source_ids:
                      continue

                  score = score_candidate(candidate, aliases)

                  if score > best_score:
                      best_score = score
                      best = candidate

              if best is not None:
                  selected[target_id] = best
                  used_source_ids.add(best["id"])

          print()
          print("Requested channels:", len(channels))
          print("Matched channels:", len(selected))
          print()

          for target_id in channels:
              if target_id in selected:
                  candidate = selected[target_id]

                  print(
                      "MATCH:",
                      target_id,
                      "<-",
                      candidate["id"],
                      "|",
                      " / ".join(candidate["names"])
                  )
              else:
                  print("SKIP:", target_id)

          # Remove every channel that wasn't selected.
          selected_elements = {
              id(candidate["element"])
              for candidate in selected.values()
          }

          for channel in list(root.findall("channel")):
              if id(channel) not in selected_elements:
                  root.remove(channel)

          # Map the source XMLTV IDs to the IDs used by our M3U.
          source_to_target = {}

          for target_id, candidate in selected.items():
              source_id = candidate["id"]

              candidate["element"].set("id", target_id)

              source_to_target[source_id] = target_id

          # Keep only programmes belonging to selected channels.
          programme_count = 0

          for programme in list(root.findall("programme")):
              source_id = programme.get("channel")

              if source_id in source_to_target:
                  programme.set(
                      "channel",
                      source_to_target[source_id]
                  )
                  programme_count += 1
              else:
                  root.remove(programme)

          print()
          print("Final matched channels:", len(selected))
          print("Programme entries:", programme_count)

          if not selected:
              raise SystemExit(
                  "ERROR: No EPG channels were matched."
              )

          if programme_count == 0:
              raise SystemExit(
                  "ERROR: No programme entries were found."
              )

          tree.write(
              OUTPUT,
              encoding="utf-8",
              xml_declaration=True
          )

          print()
          print("Created:", OUTPUT)
          PY

      - name: Validate generated files
        run: |
          test -s public/channels.m3u
          test -s public/guide.xml

          CHANNEL_COUNT=$(grep -c '^#EXTINF' public/channels.m3u || true)
          PROGRAM_COUNT=$(grep -c '<programme ' public/guide.xml || true)

          echo "Playlist channels: $CHANNEL_COUNT"
          echo "EPG programmes: $PROGRAM_COUNT"

          if [ "$CHANNEL_COUNT" -ne 30 ]; then
            echo "ERROR: Expected 30 playlist channels."
            exit 1
          fi

          if ! grep -q '<tv' public/guide.xml; then
            echo "ERROR: guide.xml is not a valid XMLTV document."
            exit 1
          fi

          if [ "$PROGRAM_COUNT" -lt 1 ]; then
            echo "ERROR: guide.xml contains no programmes."
            exit 1
          fi

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lh public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
