          http://stream.cammonitorplus.net/1785/index.m3u8

          #EXTINF:-1 tvg-id="Fox.us@East" group-title="Broadcast",FOX
          http://stream.cammonitorplus.net/1752/index.m3u8

          #EXTINF:-1 tvg-id="TheCW.us@SD" group-title="Broadcast",The CW
          https://fl7.moveonjoy.com/FL_Tampa_CW44/index.m3u8

          #EXTINF:-1 tvg-id="PBS.us@KQED" group-title="Broadcast",PBS
          https://kqeddt2.lls.pbs.org/kqeddt2-hls.m3u8

