      - name: Install dependencies
        working-directory: nexus
        run: |
          npm ci

      - name: Verify ffprobe
        run: |
          ffprobe -version | head -1

      - name: Aggregate
        working-directory: nexus
        env:
          NEXUS_BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXUS_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm run cli -- aggregate

      - name: Build merged EPG
        working-directory: nexus
        env:
          NEXUS_BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXUS_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm run cli -- epg

      - name: Build API and playlists
        working-directory: nexus
        env:
          NEXUS_BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXUS_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm run cli -- api --clean

      - name: Filter final playlist
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("nexus/public/playlists/best.m3u")

          if not path.exists():
              raise SystemExit(
                  "Could not find generated best.m3u"
              )

          curated = {
              "NBC",
              "CBS",
              "ABC",
              "Fox",
              "PBS",
              "Game Show Network",
              "History",
              "Discovery",
              "AMC",
              "FX",
              "SYFY",
              "Comedy Central",
              "Paramount",
              "MTV",
              "Freeform",
              "Hallmark Movies & More",
              "HGTV",
              "Bravo",
              "E!",
              "Lifetime",
              "Disney Channel",
              "Nickelodeon",
              "Cartoon Network",
              "FXX",
              "HBO",
              "HBO Hits",
              "HBO Movies",
              "Starz",
              "Starz Cinema",
              "Starz Comedy",
              "Cinemax",
              "Showtime",
              "A&E",
              "Bloomberg TV",
              "Documentary+",
              "Paramount+ Picks",
              "Paramount Movie Channel",
              "The Jamie Oliver Channel",
              "The Nanny",
          }

          lines = path.read_text().splitlines()

          output = []

          i = 0

          while i < len(lines):
              line = lines[i]

              if not line.startswith("#EXTINF:"):
                  output.append(line)
                  i += 1
                  continue

              name = line.split(",", 1)[1].strip() if "," in line else ""

              base_name = re.sub(
                  r"\s+\(\d+p\)$",
                  "",
                  name
              ).strip()

              if base_name in curated:
                  output.append(line)

                  if i + 1 < len(lines):
                      output.append(lines[i + 1])

              i += 2

          if not output or output[0] != "#EXTM3U":
              output.insert(
                  0,
                  '#EXTM3U x-tvg-url="https://naicumlegat.github.io/Guide/epg/guide.xml.gz"'
              )
          else:
              output[0] = (
                  '#EXTM3U x-tvg-url="https://naicumlegat.github.io/Guide/epg/guide.xml.gz"'
              )

          path.write_text(
              "\n".join(output) + "\n"
          )

          count = sum(
              1
              for line in output
              if line.startswith("#EXTINF:")
          )

          print(f"Final curated playlist: {count} channel(s)")
          PY

      - name: Create simple playlist URLs
        run: |
          mkdir -p nexus/public/epg

          if [ -f nexus/public/playlists/best.m3u ]; then
            cp nexus/public/playlists/best.m3u \
              nexus/public/channels.m3u
          fi

          if [ -f nexus/public/epg/guide.xml ]; then
            cp nexus/public/epg/guide.xml \
              nexus/public/guide.xml
          fi

          if [ -f nexus/public/epg/guide.xml.gz ]; then
            cp nexus/public/epg/guide.xml.gz \
              nexus/public/epg/guide.xml.gz
          elif [ -f nexus/public/guide.xml ]; then
            gzip -9 -c nexus/public/guide.xml \
              > nexus/public/epg/guide.xml.gz
          fi

      - name: Verify final files
        run: |
          echo "========================================"
          echo "FINAL PLAYLIST"
          echo "========================================"

          test -s nexus/public/channels.m3u

          grep -c '^#EXTINF' \
            nexus/public/channels.m3u

          echo
          echo "========================================"
          echo "FINAL EPG"
          echo "========================================"

          test -s nexus/public/epg/guide.xml.gz

          ls -lh \
            nexus/public/epg/guide.xml.gz

          echo
          echo "EPG URL:"
          echo "https://naicumlegat.github.io/Guide/epg/guide.xml.gz"

      - name: Show curated result
        working-directory: nexus
        run: |
          echo "========================================"
          echo "CURATED US CHANNELS"
          echo "========================================"

          grep '^#EXTINF' public/channels.m3u \
            | sed 's/.*,//' \
            || true

          echo
          echo "Channel count:"
          grep -c '^#EXTINF' public/channels.m3u \
            || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nexus/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
