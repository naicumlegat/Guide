name: Build and Deploy Guide

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create public directory
        run: |
          rm -rf public
          mkdir -p public

      - name: Create M3U playlist
        run: |
          cat > public/channels.m3u <<'EOF'
          #EXTM3U

          #EXTINF:-1 tvg-id="ABC.us@East" group-title="Broadcast",ABC
          http://190.11.225.124:5000/live/abc_hd/playlist.m3u8

          #EXTINF:-1 tvg-id="CBS.us@East" group-title="Broadcast",CBS
          http://stream.cammonitorplus.net/1783/index.m3u8

