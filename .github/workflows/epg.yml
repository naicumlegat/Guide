          FROZEN = {
              "PBS": (
                  "PBS.us@KQED",
                  "PBS",
                  "https://kqeddt2.lls.pbs.org/kqeddt2-hls.m3u8",
              ),
              "CNN": (
                  "CNN.us@East",
                  "CNN",
                  "https://turnerlive.warnermediacdn.com/hls/live/586495/cnngo/cnn_slate/VIDEO_0_3564000.m3u8",
              ),
              "Syfy": (
                  "SYFY.us@East",
                  "Syfy",
                  "http://23.237.104.106:8080/USA_SYFY/index.m3u8",
              ),
              "Bravo": (
                  "Bravo.us@East",
                  "Bravo",
                  "http://fl2.moveonjoy.com/BRAVO/index.m3u8",
              ),
              "E!": (
                  "E.us@East",
                  "E!",
                  "http://23.237.104.106:8080/USA_E/index.m3u8",
              ),
              "Freeform": (
                  "Freeform.us@East",
                  "Freeform",
                  "http://190.11.225.124:5000/live/freeform_hd/playlist.m3u8",
              ),
              "Disney Channel": (
                  "DisneyChannel.us@East",
                  "Disney Channel",
                  "https://e3.thetvapp.to/hls/DisneyChannelEast/index.m3u8",
              ),
              "Game Show Network": (
                  "GameShowNetwork.us@SD",
                  "Game Show Network",
                  "https://a-cdn.klowdtv.com/live2/gsn_720p/playlist.m3u8",
              ),
          }

          CANDIDATES = {
              "ABC": [
                  (
                      "WCVBDT1.us",
                      "ABC 5 Boston WCVB",
                      "https://aegis-cloudfront-1.tubi.video/c2e3094d-ad56-4c5f-9655-cd80df71fbab/playlist.m3u8",
                  ),
                  (
                      "ABC.us@East",
                      "ABC East",
                      "http://190.11.225.124:5000/live/abc_hd/playlist.m3u8",
                  ),
              ],

              "CBS": [
                  (
                      "CBS.us@East",
                      "CBS East",
                      "http://stream.cammonitorplus.net/1783/index.m3u8",
                  ),
                  (
                      "CBS.us@East",
                      "CBS East",
                      "http://190.11.225.124:5000/live/cbs_hd/playlist.m3u8",
                  ),
                  (
                      "CBS.us@East",
                      "CBS East",
                      "http://tvsen7.aynascope.net/cbs/index.m3u8",
                  ),
              ],

              "NBC": [
                  (
                      "NBC.us@East",
                      "NBC East",
                      "http://stream.cammonitorplus.net/1785/index.m3u8",
                  ),
                  (
                      "NBC.us@East",
                      "NBC East",
                      "http://190.11.225.124:5000/live/nbc_hd/playlist.m3u8",
                  ),
                  (
                      "NBC.us@East",
                      "NBC East",
                      "http://170.254.17.2/NBC/index.m3u8",
                  ),
              ],

              "TNT": [
                  (
                      "TNT.us@East",
                      "TNT East",
                      "http://170.254.18.106/TNT/index.m3u8",
                  ),
              ],

              "TBS": [
                  (
                      "TBS.us@East",
                      "TBS East",
                      "http://143.244.60.30/TBS/index.m3u8",
                  ),
              ],

              "USA Network": [
                  (
                      "USA.us@East",
                      "USA Network East",
                      "https://tvsen3.aynaott.com/dbbcY6NG/index.m3u8",
                  ),
              ],

              "FX": [
                  (
                      "FX.us@East",
                      "FX East",
                      "http://23.237.104.106:8080/USA_FX/index.m3u8",
                  ),
              ],

              "FXX": [
                  (
                      "FXX.us@East",
                      "FXX East",
                      "http://23.237.104.106:8080/USA_FXX/index.m3u8",
                  ),
              ],

              "Paramount Network": [
                  (
                      "ParamountNetwork.us@East",
                      "Paramount Network East",
                      "https://fl1.moveonjoy.com/PARAMOUNT_NETWORK/index.m3u8",
                  ),
              ],

              "Nickelodeon": [
                  (
                      "Nickelodeon.us@East",
                      "Nickelodeon East",
                      "https://sra72yz.s.gy/NICKELODEON_EAST_US.m3u8",
                  ),
                  (
                      "Nickelodeon.us@East",
                      "Nickelodeon East",
                      "http://23.237.104.106:8080/USA_NICKELODEON/index.m3u8",
                  ),
              ],

              "Cartoon Network": [
                  (
                      "CartoonNetwork.us@East",
                      "Cartoon Network",
                      "http://23.237.104.106:8080/USA_CARTOON_NETWORK/index.m3u8",
                  ),
              ],

              "Comedy Central": [
                  (
                      "ComedyCentral.us@East",
                      "Comedy Central East",
                      "http://23.237.104.106:8080/USA_COMEDY_CENTRAL/index.m3u8",
                  ),
                  (
                      "ComedyCentral.us@East",
                      "Comedy Central East",
                      "https://tvsen3.aynaott.com/5fUWDMxZ/index.m3u8",
                  ),
              ],

              "TCM": [
                  (
                      "TCM.us@East",
                      "TCM East",
                      "http://main.light-ott.net:80/play/live.php?mac=A0:BB:3E:00:01:FC&stream=855460&extension=ts",
                  ),
              ],

              "Hallmark Channel": [
                  (
                      "HallmarkChannel.us@East",
                      "Hallmark Channel East",
                      "http://23.237.104.106:8080/USA_HALLMARK/index.m3u8",
                  ),
                  (
                      "HallmarkChannel.us@East",
                      "Hallmark Channel East",
                      "http://40.160.24.53/HALLMARK/index.m3u8",
                  ),
                  (
                      "HallmarkChannel.us@East",
                      "Hallmark Channel East",
                      "http://fl2.moveonjoy.com/HALLMARK_CHANNEL/index.m3u8",
                  ),
              ],

              "AMC": [
                  (
                      "AMC.us@EastHD",
                      "AMC East",
                      "http://23.239.31.26:8989/amc/index.m3u8",
                  ),
                  (
                      "AMC.us@East",
                      "AMC East",
                      "http://190.11.225.124:5000/live/amc_hd/playlist.m3u8",
                  ),
                  (
                      "AMC.us@East",
                      "AMC East",
                      "https://fl1.moveonjoy.com/AMC_NETWORK/index.m3u8",
                  ),
              ],

              "HGTV": [
                  (
                      "HGTV.us@East",
                      "HGTV East",
                      "http://212.102.60.231/HGTV/index.m3u8",
                  ),
              ],

              "WBZ-TV": [
                  (
                      "CBS.(WBZ).Boston,.MA.us",
                      "WBZ-TV Boston",
                      "http://143.244.60.30/CBSEAST/index.m3u8",
                  ),
              ],
          }

          REQUIRED_IDS = {
              "ABC": {"WCVBDT1.us", "ABC.us@East"},
              "CBS": {"CBS.us@East"},
              "NBC": {"NBC.us@East"},
              "TNT": {"TNT.us@East"},
              "TBS": {"TBS.us@East"},
              "USA Network": {"USA.us@East"},
              "FX": {"FX.us@East"},
              "FXX": {"FXX.us@East"},
              "Paramount Network": {"ParamountNetwork.us@East"},
              "Nickelodeon": {"Nickelodeon.us@East"},
              "Cartoon Network": {"CartoonNetwork.us@East"},
              "Comedy Central": {"ComedyCentral.us@East"},
              "TCM": {"TCM.us@East"},
              "Hallmark Channel": {"HallmarkChannel.us@East"},
              "AMC": {"AMC.us@East", "AMC.us@EastHD"},
              "HGTV": {"HGTV.us@East"},
              "WBZ-TV": {"CBS.(WBZ).Boston,.MA.us"},
          }

          FORBIDDEN = {
              "ABC": {
                  "ABCNews.us@East",
                  "ABCNewsLive.us@SD",
              },
              "Hallmark Channel": {
                  "HallmarkFamily.us@East",
                  "HallmarkMystery.us@East",
                  "HallmarkMoviesMysteries.us@East",
              },
          }

          GUIDE_IDS = {
              "ABC": ["WCVBDT1.us"],
              "CBS": ["CBS.us@East"],
              "NBC": ["NBC.us@East"],
              "PBS": ["PBS.us@KQED"],
              "CNN": ["CNN.us@East"],
              "USA Network": ["USA.us@East"],
              "TNT": ["TNT.us@East"],
              "TBS": ["TBS.us@East"],
              "FX": ["FX.us@East"],
              "FXX": ["FXX.us@East"],
              "Paramount Network": ["ParamountNetwork.us@East"],
              "Syfy": ["SYFY.us@East"],
              "Bravo": ["Bravo.us@East"],
              "E!": ["E.us@East"],
              "Freeform": ["Freeform.us@East"],
              "Disney Channel": ["DisneyChannel.us@East"],
              "Nickelodeon": ["Nickelodeon.us@East"],
              "Cartoon Network": ["CartoonNetwork.us@East"],
              "Comedy Central": ["ComedyCentral.us@East"],
              "TCM": ["TCM.us@East"],
              "Hallmark Channel": ["HallmarkChannel.us@East"],
              "AMC": ["AMC.us@East", "AMC.us@EastHD"],
              "HGTV": ["HGTV.us@East"],
              "Game Show Network": ["GameShowNetwork.us@SD"],
              "WBZ-TV": ["CBS.(WBZ).Boston,.MA.us"],
          }

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "*/*",
          }

          def extract_attr(extinf, attr):
              m = re.search(
                  rf'{re.escape(attr)}="([^"]*)"',
                  extinf
              )
              return m.group(1) if m else ""

          def parse_m3u(path):
              entries = []

              lines = Path(path).read_text(
                  encoding="utf-8",
                  errors="ignore"
              ).splitlines()

              current = None

              for line in lines:
                  line = line.strip()

                  if line.startswith("#EXTINF:"):
                      current = line
                  elif current and line and not line.startswith("#"):
                      entries.append((current, line))
                      current = None

              return entries

          sources = []

          for filename in [
              "current-us.m3u",
              "new-york.m3u",
              "boston.m3u",
          ]:
              sources.extend(parse_m3u(filename))

          def fetch(url, timeout=15):
              req = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              return urllib.request.urlopen(
                  req,
                  timeout=timeout
              )

          def test_stream(url):
              try:
                  with fetch(url) as r:
                      status = getattr(r, "status", 200)

                      content_type = (
                          r.headers.get("Content-Type")
                          or ""
                      ).lower()

                      data = r.read(32768)

                      if status < 200 or status >= 400:
                          return False, f"HTTP {status}"

                      if not data:
                          return False, "empty response"

                      text = data.decode(
                          "utf-8",
                          errors="ignore"
                      )

                      if b"#EXTM3U" in data:
                          if (
                              "#EXTINF:" in text
                              or "#EXT-X-STREAM-INF:" in text
                              or "#EXT-X-TARGETDURATION:" in text
                          ):
                              return True, (
                                  f"HLS {status} {content_type}"
                              )

                          return False, (
                              "HLS playlist has no media entries"
                          )

                      if (
                          "video" in content_type
                          or "mpeg" in content_type
                          or "octet-stream" in content_type
                          or url.lower().endswith(".ts")
                      ):
                          return True, (
                              f"media {status} {content_type}"
                          )

                      if (
                          len(data) >= 1024
                          and not text.lstrip().lower().startswith(
                              (
                                  "<html",
                                  "<!doctype",
                                  "<head",
                              )
                          )
                      ):
                          return True, (
                              f"binary {status} {content_type}"
                          )

                      return False, (
                          f"not a stream ({content_type})"
                      )

              except Exception as e:
                  return False, str(e)

          Path("public").mkdir(exist_ok=True)

          playlist_lines = [
              "#EXTM3U"
          ]

          selected = {}

          print("=" * 60)
          print("STRICT VERIFIED STREAM SELECTION")
          print("=" * 60)

          for channel in CHANNELS:
              candidates = []

              if channel in FROZEN:
                  candidates.append(FROZEN[channel])

              allowed_ids = REQUIRED_IDS.get(
                  channel,
                  set()
              )

              for extinf, url in sources:
                  tvg_id = extract_attr(
                      extinf,
                      "tvg-id"
                  )

                  if tvg_id in allowed_ids:
                      candidates.append(
                          (
                              tvg_id,
                              channel,
                              url,
                          )
                      )

              candidates.extend(
                  CANDIDATES.get(
                      channel,
                      []
                  )
              )

              forbidden_ids = FORBIDDEN.get(
                  channel,
                  set()
              )

              found = None
              seen_urls = set()

              for tvg_id, display_name, url in candidates:
                  if url in seen_urls:
                      continue

                  seen_urls.add(url)

                  if (
                      tvg_id not in allowed_ids
                      and channel not in FROZEN
                  ):
                      continue

                  if tvg_id in forbidden_ids:
                      continue

                  ok, reason = test_stream(url)

                  if ok:
                      found = (
                          tvg_id,
                          display_name,
                          url,
                          reason,
                      )

                      print(
                          f"VERIFIED: {channel}\n"
                          f"          ID:  {tvg_id}\n"
                          f"          URL: {url}\n"
                          f"          TEST: {reason}\n"
                      )

                      break

                  print(
                      f"FAILED: {channel}\n"
                      f"        ID:  {tvg_id}\n"
                      f"        URL: {url}\n"
                      f"        TEST: {reason}\n"
                  )

              if not found:
                  print(
                      f"\nERROR: No verified stream found for {channel}"
                  )
                  print(
                      "The workflow will NOT substitute "
                      "an unrelated channel."
                  )
                  raise SystemExit(1)

              tvg_id, display_name, url, reason = found

              selected[channel] = (
                  tvg_id,
                  display_name,
                  url,
              )

              playlist_lines.append(
                  f'#EXTINF:-1 tvg-id="{tvg_id}" '
                  f'group-title="USA",{display_name}'
              )

              playlist_lines.append(url)

          Path("public/channels.m3u").write_text(
              "\n".join(playlist_lines) + "\n",
              encoding="utf-8"
          )

          playlist_text = Path(
              "public/channels.m3u"
          ).read_text(
              encoding="utf-8"
          )

          if re.search(
              r'^#EXTINF.*FOX',
              playlist_text,
              re.IGNORECASE | re.MULTILINE,
          ):
              print(
                  "ERROR: FOX is still present in the playlist."
              )
              raise SystemExit(1)

          if re.search(
              r"Fox News|Fox Deportes|Fox Business|Fox Weather",
              playlist_text,
              re.IGNORECASE,
          ):
              print(
                  "ERROR: Invalid FOX-branded channel detected."
              )
              raise SystemExit(1)

          if re.search(
              r"natgeo|nationalgeographic",
              playlist_text,
              re.IGNORECASE,
          ):
              print(
                  "ERROR: Unrelated National Geographic "
                  "stream detected."
              )
              raise SystemExit(1)

          with gzip.open(
              "merged_epg.xml.gz",
              "rb"
          ) as f:
              epg_root = ET.fromstring(
                  f.read()
              )

          channels_by_id = {
              c.attrib.get("id"): c
              for c in epg_root.findall("channel")
          }

          programs_by_channel = {}

          for programme in epg_root.findall("programme"):
              channel_id = programme.attrib.get(
                  "channel"
              )

              if channel_id:
                  programs_by_channel.setdefault(
                      channel_id,
                      []
                  ).append(programme)

          guide_root = ET.Element("tv")

          for channel in CHANNELS:
              if channel not in selected:
                  continue

              selected_id = selected[channel][0]

              guide_ids = GUIDE_IDS.get(
                  channel,
                  [selected_id]
              )

              source_channel = None

              for guide_id in guide_ids:
                  if guide_id in channels_by_id:
                      source_channel = channels_by_id[
                          guide_id
                      ]
                      break

              if source_channel is None:
                  print(
                      f"EPG MISSING: {channel}"
                  )
                  continue

              new_channel = ET.SubElement(
                  guide_root,
                  "channel",
                  {"id": selected_id},
              )

              display = source_channel.find(
                  "display-name"
              )

              if display is not None:
                  new_display = ET.SubElement(
                      new_channel,
                      "display-name"
                  )
                  new_display.text = display.text

              for programme in programs_by_channel.get(
                  source_channel.attrib.get("id"),
                  []
              ):
                  new_programme = ET.fromstring(
                      ET.tostring(programme)
                  )

                  new_programme.set(
                      "channel",
                      selected_id
                  )

                  guide_root.append(
                      new_programme
                  )

          tree = ET.ElementTree(
              guide_root
          )

          ET.indent(
              tree,
              space="  "
          )

          tree.write(
              "public/guide.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          print()
          print(
              f"Built {len(selected)} verified channels."
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
