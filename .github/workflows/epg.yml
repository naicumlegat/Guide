      - name: Install dependencies
        working-directory: nexus
        run: npm ci

      - name: Verify ffprobe
        run: ffprobe -version | head -1

      - name: Aggregate
        working-directory: nexus
        env:
          NEXUS_BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXUS_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: npm run cli -- aggregate

      - name: Build merged EPG
        working-directory: nexus
        env:
          NEXUS_BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXUS_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: npm run cli -- epg

      - name: Build API and playlists
        working-directory: nexus
        env:
          NEXUS_BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXUS_REPOSITORY: ${{ github.server_url }}/${{ github.event.repository.name }}
        run: npm run cli -- api --clean

      - name: Filter final playlist
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path("nexus/public/playlists/best.m3u")
          dataset_path = Path("nexus/.data/channels.json")

          if not path.exists():
              raise SystemExit("Could not find generated best.m3u")

          if not dataset_path.exists():
              raise SystemExit("Could not find aggregated channels.json")

          dataset = json.loads(dataset_path.read_text())

          curated_ids = {
              str(channel.get("id", "")).strip()
              for channel in dataset.get("channels", [])
              if channel.get("id")
          }

          if not curated_ids:
              raise SystemExit("No curated channel IDs found")

          print(f"Curated channel IDs: {len(curated_ids)}")

          lines = path.read_text().splitlines()
          output = []
          i = 0

          while i < len(lines):
              line = lines[i]

              if not line.startswith("#EXTINF:"):
                  i += 1
                  continue

              match = re.search(r'tvg-id="([^"]*)"', line)

              tvg_id = (
                  match.group(1).strip()
                  if match
                  else ""
              )

              if tvg_id in curated_ids:
                  output.append(line)

                  if i + 1 < len(lines):
                      output.append(lines[i + 1])

              i += 2

          if not output:
              raise SystemExit("Whitelist removed every channel")

          output.insert(
              0,
              '#EXTM3U x-tvg-url="https://naicumlegat.github.io/Guide/epg/guide.xml.gz"'
          )

          path.write_text("\n".join(output) + "\n")

          count = sum(
              1
              for line in output
              if line.startswith("#EXTINF:")
          )

          print(f"Final curated playlist: {count} channel(s)")
          PY

      - name: Create final EPG files
        run: |
          set -e
          mkdir -p nexus/public/epg

          echo "========================================"
          echo "BUILD FINAL XMLTV EPG"
          echo "========================================"

          python - <<'PY'
          import gzip
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          source_dir = Path("epg-state")
          output_xml = Path("nexus/public/guide.xml")
          output_gz = Path("nexus/public/epg/guide.xml.gz")
          dataset_path = Path("nexus/.data/channels.json")

          dataset = json.loads(dataset_path.read_text())

          curated_ids = {
              str(channel.get("id", "")).strip()
              for channel in dataset.get("channels", [])
              if channel.get("id")
          }

          files = sorted(source_dir.glob("*.xml.gz"))

          if not files:
              raise SystemExit(
                  "ERROR: No EPG state files were restored."
              )

          print("EPG state files:")

          for file in files:
              print(f"  {file}")

          root = ET.Element(
              "tv",
              {
                  "generator-info-name": "Guide Curated IPTV",
              },
          )

          channel_ids = set()
          programme_keys = set()

          def normalize_channel_id(value):
              if not value:
                  return value

              value = str(value).strip()
              base = value.split("@", 1)[0].strip()

              if base in curated_ids:
                  return base

              return value

          for file in files:
              print(f"Reading {file}")

              with gzip.open(file, "rb") as fh:
                  source_root = ET.parse(fh).getroot()

              for channel in source_root.findall("channel"):
                  original_id = channel.get("id")

                  if not original_id:
                      continue

                  channel_id = normalize_channel_id(original_id)

                  if channel_id not in curated_ids:
                      continue

                  new_channel = ET.fromstring(
                      ET.tostring(channel)
                  )

                  new_channel.set("id", channel_id)

                  if channel_id in channel_ids:
                      continue

                  channel_ids.add(channel_id)
                  root.append(new_channel)

              for programme in source_root.findall("programme"):
                  original_channel = programme.get("channel")

                  if not original_channel:
                      continue

                  channel_id = normalize_channel_id(
                      original_channel
                  )

                  if channel_id not in curated_ids:
                      continue

                  new_programme = ET.fromstring(
                      ET.tostring(programme)
                  )

                  new_programme.set("channel", channel_id)

                  key = (
                      channel_id,
                      new_programme.get("start"),
                      new_programme.get("stop"),
                      ET.tostring(
                          new_programme,
                          encoding="unicode"
                      ),
                  )

                  if key in programme_keys:
                      continue

                  programme_keys.add(key)
                  root.append(new_programme)

          if not channel_ids:
              raise SystemExit(
                  "ERROR: Restored EPG files contained no curated channels."
              )

          if not programme_keys:
              raise SystemExit(
                  "ERROR: Restored EPG files contained no curated programmes."
              )

          try:
              ET.indent(root, space="  ")
          except AttributeError:
              pass

          output_xml.parent.mkdir(parents=True, exist_ok=True)

          ET.ElementTree(root).write(
              output_xml,
              encoding="utf-8",
              xml_declaration=True,
          )

          output_gz.parent.mkdir(parents=True, exist_ok=True)

          with output_xml.open("rb") as source:
              with gzip.open(
                  output_gz,
                  "wb",
                  compresslevel=9
              ) as target:
                  target.write(source.read())

          print(f"EPG channels: {len(channel_ids)}")
          print(f"EPG programmes: {len(programme_keys)}")
          print(f"XMLTV: {output_xml}")
          print(f"GZIP: {output_gz}")
          PY

          cp nexus/public/guide.xml nexus/public/epg/guide.xml

          echo
          echo "Final EPG files:"
          ls -lh \
            nexus/public/guide.xml \
            nexus/public/epg/guide.xml \
            nexus/public/epg/guide.xml.gz

      - name: Create simple playlist URL
        run: |
          cp nexus/public/playlists/best.m3u \
            nexus/public/channels.m3u

      - name: Verify final files
        run: |
          echo "========================================"
          echo "FINAL PLAYLIST"
          echo "========================================"

          test -s nexus/public/channels.m3u

          grep -c '^#EXTINF' \
            nexus/public/channels.m3u

          echo
          echo "========================================"
          echo "FINAL EPG"
          echo "========================================"

          test -s nexus/public/epg/guide.xml.gz

          gzip -t nexus/public/epg/guide.xml.gz

          ls -lh nexus/public/epg/guide.xml.gz

          echo
          echo "EPG URL:"
          echo "https://naicumlegat.github.io/Guide/epg/guide.xml.gz"

      - name: Show curated result
        working-directory: nexus
        run: |
          echo "========================================"
          echo "CURATED US CHANNELS"
          echo "========================================"

          grep '^#EXTINF' public/channels.m3u \
            | sed 's/.*,//' \
            || true

          echo
          echo "Channel count:"

          grep -c '^#EXTINF' public/channels.m3u \
            || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nexus/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
