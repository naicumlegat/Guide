name: Build Curated IPTV

on:
  schedule:
    - cron: "15 0,6,12,18 * * *"
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: curated-iptv
  cancel-in-progress: false

env:
  ENGINE_REPO: https://github.com/dearbulut/iptv.git

jobs:

  epg:
    name: EPG Grab
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config directory
        run: |
          mkdir -p config

      - name: Clone Dearbulut engine
        run: |
          git clone --depth 1 "$ENGINE_REPO" nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore discovered streams
        run: |
          mkdir -p nexus/config

          if [ -f config/discovered.m3u ]; then
            cp config/discovered.m3u nexus/config/discovered.m3u
          else
            printf '#EXTM3U\n' > nexus/config/discovered.m3u
          fi

      - name: Configure discovered source
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("config/sources.yml")
          text = path.read_text()

          repo = os.environ["GITHUB_REPOSITORY"]

          url = (
              f"https://raw.githubusercontent.com/"
              f"{repo}/main/config/discovered.m3u"
          )

          text = text.replace(
              "https://raw.githubusercontent.com/dearbulut/iptv/main/config/discovered.m3u",
              url
          )

          path.write_text(text)
          PY

      - name: Preserve stream feed identity
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aggregate/sources.ts")
          text = path.read_text()

          if "function splitChannelFeed(" not in text:
              marker = "interface JsonStreamShape {"

              helper = r'''
          function splitChannelFeed(value: string | null): {
            channel: string | null;
            feed: string | null;
          } {
            const valueTrimmed = value?.trim() ?? "";

            if (!valueTrimmed) {
              return {
                channel: null,
                feed: null,
              };
            }

            const at = valueTrimmed.indexOf("@");

            if (at <= 0 || at === valueTrimmed.length - 1) {
              return {
                channel: valueTrimmed,
                feed: null,
              };
            }

            return {
              channel: valueTrimmed.slice(0, at),
              feed: valueTrimmed.slice(at + 1),
            };
          }

          '''

              if marker not in text:
                  raise SystemExit(
                      "Could not locate sources.ts insertion point"
                  )

              text = text.replace(
                  marker,
                  helper + marker,
                  1
              )

          old = """      const title = entry.title ?? entry.name ?? '';
          push({
            channel: entry.channel ?? entry.tvg_id ?? null,
            feed: entry.feed ?? null,"""

          new = """      const identity = splitChannelFeed(
            entry.channel ?? entry.tvg_id ?? null
          );

          push({
            channel: identity.channel,
            feed: entry.feed ?? identity.feed,"""

          if old in text:
              text = text.replace(old, new, 1)

          old = """      const tvgId = entry.attributes['tvg-id']?.trim() || null;
          const title = entry.title || entry.attributes['tvg-name'] || '';
          push({
            channel: tvgId,
            feed: null,"""

          new = """      const tvgId = entry.attributes['tvg-id']?.trim() || null;
          const identity = splitChannelFeed(tvgId);
          const title = entry.title || entry.attributes['tvg-name'] || '';

          push({
            channel: identity.channel,
            feed: identity.feed,"""

          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Apply channel whitelist
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aggregate/index.ts")
          text = path.read_text()

          marker = "await saveDataset(dataset);"

          whitelist = r'''
          const CURATED_NAMES = new Set([
            "nbc",
            "cbs",
            "abc",
            "fox",
            "pbs",
            "game show network",
            "history",
            "discovery",
            "amc",
            "fx",
            "syfy",
            "comedy central",
            "paramount",
            "paramount network",
            "mtv",
            "freeform",
            "hallmark movies & more",
            "hgtv",
            "bravo",
            "e!",
            "lifetime",
            "disney channel",
            "nickelodeon",
            "cartoon network",
            "fxx",
            "hbo",
            "hbo hits",
            "hbo movies",
            "starz",
            "starz cinema",
            "starz comedy",
            "cinemax",
            "showtime",
            "a&e",
            "bloomberg tv",
            "documentary+",
            "paramount+ picks",
            "paramount movie channel",
            "the jamie oliver channel",
            "the nanny"
          ]);

          const normalizeCuratedName = (value: string): string =>
            value
              .trim()
              .toLowerCase()
              .replace(/\s+/g, " ");

          dataset.channels = dataset.channels.filter((channel) => {
            const names = [
              channel.name,
              ...channel.alt_names,
            ].map(normalizeCuratedName);

            const isCurated = names.some((name) =>
              CURATED_NAMES.has(name)
            );

            if (!isCurated) return false;

            if (names.includes("hgtv")) return true;

            return channel.country === "US";
          });

          dataset.orphans = [];

          log.info(
            `Curated US whitelist: ${dataset.channels.length} channel(s)`
          );
          '''

          if "const CURATED_NAMES = new Set([" in text:
              print("Whitelist already patched")
              raise SystemExit(0)

          if marker not in text:
              raise SystemExit(
                  "Could not locate aggregate save marker"
              )

          text = text.replace(
              marker,
              whitelist + "\n          " + marker,
              1
          )

          path.write_text(text)
          PY

      - name: Restore health database
        working-directory: nexus
        run: |
          mkdir -p .data

          git fetch origin state:state --depth=1 2>/dev/null || true

          git show state:health.json \
            > .data/health.json 2>/dev/null || true

      - name: Install Dearbulut dependencies
        working-directory: nexus
        run: |
          npm ci

      - name: Aggregate curated dataset
        working-directory: nexus
        run: |
          npm run cli -- aggregate

      - name: Clone iptv-org EPG grabber
        run: |
          git clone --depth 1 -b master \
            https://github.com/iptv-org/epg.git epg

      - name: Install EPG dependencies
        working-directory: epg
        run: |
          npm install --no-audit --no-fund

      - name: Build feed-specific EPG channel lists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import re

          dataset_path = Path("nexus/.data/channels.json")
          config_path = Path("nexus/config/epg-grab.yml")
          output_dir = Path("epg/custom")

          output_dir.mkdir(parents=True, exist_ok=True)

          dataset = json.loads(dataset_path.read_text())

          channels = dataset.get("channels", [])
          guides = dataset.get("guides", [])

          curated_ids = {
              str(channel.get("id", "")).strip()
              for channel in channels
              if channel.get("id")
          }

          feed_by_channel = {}

          for channel in channels:
              channel_id = str(
                  channel.get("id", "")
              ).strip()

              feeds = set()

              for stream in channel.get("streams", []):
                  feed = stream.get("feed")

                  if feed:
                      feeds.add(str(feed).strip())

              feed_by_channel[channel_id] = feeds

          sites = []
          current = None

          for raw in config_path.read_text().splitlines():
              line = raw.replace("\r", "").rstrip()

              if not line.strip() or line.lstrip().startswith("#"):
                  continue

              stripped = line.strip()

              if stripped == "sites:":
                  continue

              item = re.match(r"^\s*-\s*(.*)$", line)

              if item:
                  if (
                      current
                      and current.get("site")
                      and current.get("enabled", True)
                  ):
                      sites.append(current)

                  current = {}

                  if item.group(1):
                      m = re.match(
                          r"^([A-Za-z_][\w-]*)\s*:\s*(.*)$",
                          item.group(1)
                      )

                      if m:
                          value = m.group(2).strip()
                          value = value.strip("'\"")
                          current[m.group(1)] = value

                  continue

              if current is not None:
                  m = re.match(
                      r"^\s*([A-Za-z_][\w-]*)\s*:\s*(.*)$",
                      line
                  )

                  if not m:
                      continue

                  key = m.group(1)
                  value = m.group(2).strip()

                  if value == "true":
                      value = True
                  elif value == "false":
                      value = False
                  elif re.fullmatch(r"-?\d+", value):
                      value = int(value)
                  else:
                      value = value.strip("'\"")

                  current[key] = value

          if (
              current
              and current.get("site")
              and current.get("enabled", True)
          ):
              sites.append(current)

          by_site = {}

          for guide in guides:
              channel_id = str(
                  guide.get("channel") or ""
              ).strip()

              site = str(
                  guide.get("site") or ""
              ).strip()

              site_id = str(
                  guide.get("site_id") or ""
              ).strip()

              lang = str(
                  guide.get("lang") or "en"
              ).strip()

              feed = guide.get("feed")

              if not channel_id:
                  continue

              if channel_id not in curated_ids:
                  continue

              if not site or not site_id:
                  continue

              desired_feeds = feed_by_channel.get(
                  channel_id,
                  set()
              )

              if desired_feeds:
                  if feed:
                      if str(feed).strip() not in desired_feeds:
                          continue
                  else:
                      continue

              xmltv_id = channel_id

              if feed:
                  xmltv_id += "@" + str(feed).strip()

              key = (
                  site.lower(),
                  site_id.lower(),
                  lang.lower(),
                  xmltv_id.lower(),
              )

              by_site.setdefault(site, {})

              if key in by_site[site]:
                  continue

              channel_name = next(
                  (
                      str(c.get("name", channel_id))
                      for c in channels
                      if str(c.get("id", "")) == channel_id
                  ),
                  channel_id,
              )

              by_site[site][key] = {
                  "site": site,
                  "site_id": site_id,
                  "lang": lang,
                  "xmltv_id": xmltv_id,
                  "name": channel_name,
              }

          print()
          print("========================================")
          print("FEED-SPECIFIC EPG CHANNEL LISTS")
          print("========================================")

          total = 0

          for site_config in sites:
              site = str(site_config["site"])

              entries = list(
                  by_site.get(site, {}).values()
              )

              slug = (
                  str(
                      site_config.get("slug")
                      or re.sub(
                          r"[^a-z0-9]+",
                          "-",
                          site.lower()
                      )
                  )
                  .strip("-")
              )

              output = output_dir / f"{slug}.channels.xml"

              root = ET.Element("channels")

              for entry in sorted(
                  entries,
                  key=lambda x: (
                      x["xmltv_id"],
                      x["site_id"],
                  )
              ):
                  node = ET.SubElement(
                      root,
                      "channel",
                      {
                          "site": entry["site"],
                          "site_id": entry["site_id"],
                          "lang": entry["lang"],
                          "xmltv_id": entry["xmltv_id"],
                      },
                  )

                  node.text = entry["name"]

              try:
                  ET.indent(root, space="  ")
              except AttributeError:
                  pass

              ET.ElementTree(root).write(
                  output,
                  encoding="utf-8",
                  xml_declaration=True,
              )

              print(
                  f"{site}: {len(entries)} channel/feed mapping(s)"
              )

              total += len(entries)

          print("----------------------------------------")
          print(f"Total feed mappings: {total}")
          print("========================================")
          PY

      - name: Grab feed-specific EPG sources
        run: |
          set -e

          mkdir -p guides

          sites=$(node - <<'NODE'
          const fs = require("fs");

          const text = fs.readFileSync(
            "nexus/config/epg-grab.yml",
            "utf8"
          );

          const sites = [];
          let current = null;

          for (const raw of text.split(/\r?\n/)) {
            const line = raw.replace(/\s+#.*$/, "").trimEnd();

            if (!line.trim() || line.trim().startsWith("#")) {
              continue;
            }

            if (line.trim() === "sites:") {
              continue;
            }

            const item = /^\s*-\s*(.*)$/.exec(line);

            if (item) {
              if (
                current &&
                current.site &&
                current.enabled !== false
              ) {
                sites.push(current);
              }

              current = {};

              if (item[1]) {
                const m =
                  /^([A-Za-z_][\w-]*)\s*:\s*(.*)$/.exec(
                    item[1]
                  );

                if (m) {
                  current[m[1]] =
                    m[2].replace(/^['"]|['"]$/g, "");
                }
              }

              continue;
            }

            if (current) {
              const m =
                /^([A-Za-z_][\w-]*)\s*:\s*(.*)$/.exec(
                  line.trim()
                );

              if (!m) {
                continue;
              }

              let value = m[2].trim();

              if (value === "true") {
                value = true;
              } else if (value === "false") {
                value = false;
              } else if (/^-?\d+$/.test(value)) {
                value = Number(value);
              } else {
                value = value.replace(
                  /^['"]|['"]$/g,
                  ""
                );
              }

              current[m[1]] = value;
            }
          }

          if (
            current &&
            current.site &&
            current.enabled !== false
          ) {
            sites.push(current);
          }

          for (const site of sites) {
            console.log(
              [
                site.site,
                site.slug ||
                  String(site.site).replace(
                    /[^a-z0-9]+/gi,
                    "-"
                  ),
                site.timeout || 30000,
                site.max_connections || 8
              ].join("|")
            );
          }
          NODE
          )

          while IFS="|" read -r site slug timeout connections; do
            [ -z "$site" ] && continue

            channels_file="epg/custom/${slug}.channels.xml"

            echo "========================================"
            echo "EPG: $site"
            echo "========================================"

            if [ ! -s "$channels_file" ]; then
              echo "No curated feed mappings for $site"
              continue
            fi

            echo "Channel mappings:"
            grep -c '<channel ' "$channels_file" || true

            rm -f epg/guide.xml
            rm -f epg/guide.xml.gz

            (
              cd epg

              npm run grab -- \
                --channels="custom/${slug}.channels.xml" \
                --output=guide.xml \
                --days=3 \
                --timeout="$timeout" \
                --maxConnections="$connections" \
                --gzip
            ) || true

            if [ ! -s epg/guide.xml ]; then
              echo "No guide produced for $site"
              continue
            fi

            programmes=$(grep -c '<programme' epg/guide.xml || true)

            if [ "${programmes:-0}" -lt 1 ]; then
              echo "No programmes produced for $site"
              continue
            fi

            if [ -f epg/guide.xml.gz ]; then
              cp epg/guide.xml.gz \
                "guides/${slug}.xml.gz"
            else
              gzip -9 -c epg/guide.xml > \
                "guides/${slug}.xml.gz"
            fi

            echo "Saved $site: $programmes programme(s)"
          done <<< "$sites"

      - name: Publish EPG state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: nexus
        run: |
          cp -R ../guides ./guides

          chmod +x scripts/publish-state.sh

          ./scripts/publish-state.sh \
            "epg: $(date -u +%FT%TZ)" \
            guides/:epg/

  discovery:
    name: Discover Streams
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config directory
        run: |
          mkdir -p config

      - name: Clone Dearbulut engine
        run: |
          git clone --depth 1 "$ENGINE_REPO" nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore discovered streams
        run: |
          mkdir -p nexus/config

          if [ -f config/discovered.m3u ]; then
            cp config/discovered.m3u nexus/config/discovered.m3u
          else
            printf '#EXTM3U\n' > nexus/config/discovered.m3u
          fi

      - name: Configure discovered source
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("config/sources.yml")
          text = path.read_text()

          repo = os.environ["GITHUB_REPOSITORY"]

          url = (
              f"https://raw.githubusercontent.com/"
              f"{repo}/main/config/discovered.m3u"
          )

          text = text.replace(
              "https://raw.githubusercontent.com/dearbulut/iptv/main/config/discovered.m3u",
              url
          )

          path.write_text(text)
          PY

      - name: Preserve stream feed identity
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aggregate/sources.ts")
          text = path.read_text()

          if "function splitChannelFeed(" not in text:
              marker = "interface JsonStreamShape {"

              helper = r'''
          function splitChannelFeed(value: string | null): {
            channel: string | null;
            feed: string | null;
          } {
            const valueTrimmed = value?.trim() ?? "";

            if (!valueTrimmed) {
              return {
                channel: null,
                feed: null,
              };
            }

            const at = valueTrimmed.indexOf("@");

            if (at <= 0 || at === valueTrimmed.length - 1) {
              return {
                channel: valueTrimmed,
                feed: null,
              };
            }

            return {
              channel: valueTrimmed.slice(0, at),
              feed: valueTrimmed.slice(at + 1),
            };
          }

          '''

              if marker not in text:
                  raise SystemExit(
                      "Could not locate sources.ts insertion point"
                  )

              text = text.replace(
                  marker,
                  helper + marker,
                  1
              )

          old = """      const title = entry.title ?? entry.name ?? '';
          push({
            channel: entry.channel ?? entry.tvg_id ?? null,
            feed: entry.feed ?? null,"""

          new = """      const identity = splitChannelFeed(
            entry.channel ?? entry.tvg_id ?? null
          );

          push({
            channel: identity.channel,
            feed: entry.feed ?? identity.feed,"""

          if old in text:
              text = text.replace(old, new, 1)

          old = """      const tvgId = entry.attributes['tvg-id']?.trim() || null;
          const title = entry.title || entry.attributes['tvg-name'] || '';
          push({
            channel: tvgId,
            feed: null,"""

          new = """      const tvgId = entry.attributes['tvg-id']?.trim() || null;
          const identity = splitChannelFeed(tvgId);
          const title = entry.title || entry.attributes['tvg-name'] || '';

          push({
            channel: identity.channel,
            feed: identity.feed,"""

          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Apply channel whitelist
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aggregate/index.ts")
          text = path.read_text()

          marker = "await saveDataset(dataset);"

          whitelist = r'''
          const CURATED_NAMES = new Set([
            "nbc",
            "cbs",
            "abc",
            "fox",
            "pbs",
            "game show network",
            "history",
            "discovery",
            "amc",
            "fx",
            "syfy",
            "comedy central",
            "paramount",
            "paramount network",
            "mtv",
            "freeform",
            "hallmark movies & more",
            "hgtv",
            "bravo",
            "e!",
            "lifetime",
            "disney channel",
            "nickelodeon",
            "cartoon network",
            "fxx",
            "hbo",
            "hbo hits",
            "hbo movies",
            "starz",
            "starz cinema",
            "starz comedy",
            "cinemax",
            "showtime",
            "a&e",
            "bloomberg tv",
            "documentary+",
            "paramount+ picks",
            "paramount movie channel",
            "the jamie oliver channel",
            "the nanny"
          ]);

          const normalizeCuratedName = (value: string): string =>
            value
              .trim()
              .toLowerCase()
              .replace(/\s+/g, " ");

          dataset.channels = dataset.channels.filter((channel) => {
            const names = [
              channel.name,
              ...channel.alt_names,
            ].map(normalizeCuratedName);

            const isCurated = names.some((name) =>
              CURATED_NAMES.has(name)
            );

            if (!isCurated) return false;

            if (names.includes("hgtv")) return true;

            return channel.country === "US";
          });

          dataset.orphans = [];

          log.info(
            `Curated US whitelist: ${dataset.channels.length} channel(s)`
          );
          '''

          if "const CURATED_NAMES = new Set([" in text:
              print("Whitelist already patched")
              raise SystemExit(0)

          if marker not in text:
              raise SystemExit(
                  "Could not locate aggregate save marker"
              )

          text = text.replace(
              marker,
              whitelist + "\n          " + marker,
              1
          )

          path.write_text(text)
          PY

      - name: Restore discovery rejection memory
        working-directory: nexus
        run: |
          mkdir -p .data

          git fetch origin state:state --depth=1 2>/dev/null || true

          git show state:discovery.json \
            > .data/discovery.json 2>/dev/null || true

      - name: Install dependencies
        working-directory: nexus
        run: |
          npm ci

      - name: Verify ffprobe
        run: |
          ffprobe -version | head -1

      - name: Aggregate curated dataset
        working-directory: nexus
        run: |
          npm run cli -- aggregate

      - name: Discover and verify replacements
        working-directory: nexus
        run: |
          npm run cli -- discover \
            --max-probes 800 \
            --apply

      - name: Copy discovered streams back
        run: |
          mkdir -p config

          cp nexus/config/discovered.m3u \
            config/discovered.m3u

      - name: Commit discovered streams
        run: |
          if git diff --quiet -- config/discovered.m3u; then
            echo "No new discovered streams"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/discovered.m3u

          git commit \
            -m "discovery: update curated streams"

          git pull --rebase --quiet origin main || true

          git push origin HEAD:main

      - name: Persist discovery rejection memory
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: nexus
        run: |
          if [ ! -f .data/discovery.json ]; then
            exit 0
          fi

          chmod +x scripts/publish-state.sh

          ./scripts/publish-state.sh \
            "discovery: $(date -u +%FT%TZ)" \
            .data/discovery.json:discovery.json

  health:
    name: Health Scan
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 3,15 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config directory
        run: |
          mkdir -p config

      - name: Clone Dearbulut engine
        run: |
          git clone --depth 1 "$ENGINE_REPO" nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore discovered streams
        run: |
          mkdir -p nexus/config

          if [ -f config/discovered.m3u ]; then
            cp config/discovered.m3u nexus/config/discovered.m3u
          else
            printf '#EXTM3U\n' > nexus/config/discovered.m3u
          fi

      - name: Configure discovered source
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("config/sources.yml")
          text = path.read_text()

          repo = os.environ["GITHUB_REPOSITORY"]

          url = (
              f"https://raw.githubusercontent.com/"
              f"{repo}/main/config/discovered.m3u"
          )

          text = text.replace(
              "https://raw.githubusercontent.com/dearbulut/iptv/main/config/discovered.m3u",
              url
          )

          path.write_text(text)
          PY

      - name: Apply channel whitelist
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aggregate/index.ts")
          text = path.read_text()

          marker = "await saveDataset(dataset);"

          whitelist = r'''
          const CURATED_NAMES = new Set([
            "nbc",
            "cbs",
            "abc",
            "fox",
            "pbs",
            "game show network",
            "history",
            "discovery",
            "amc",
            "fx",
            "syfy",
            "comedy central",
            "paramount",
            "paramount network",
            "mtv",
            "freeform",
            "hallmark movies & more",
            "hgtv",
            "bravo",
            "e!",
            "lifetime",
            "disney channel",
            "nickelodeon",
            "cartoon network",
            "fxx",
            "hbo",
            "hbo hits",
            "hbo movies",
            "starz",
            "starz cinema",
            "starz comedy",
            "cinemax",
            "showtime",
            "a&e",
            "bloomberg tv",
            "documentary+",
            "paramount+ picks",
            "paramount movie channel",
            "the jamie oliver channel",
            "the nanny"
          ]);

          const normalizeCuratedName = (value: string): string =>
            value
              .trim()
              .toLowerCase()
              .replace(/\s+/g, " ");

          dataset.channels = dataset.channels.filter((channel) => {
            const names = [
              channel.name,
              ...channel.alt_names,
            ].map(normalizeCuratedName);

            const isCurated = names.some((name) =>
              CURATED_NAMES.has(name)
            );

            if (!isCurated) return false;

            if (names.includes("hgtv")) return true;

            return channel.country === "US";
          });

          dataset.orphans = [];

          log.info(
            `Curated US whitelist: ${dataset.channels.length} channel(s)`
          );
          '''

          if "const CURATED_NAMES = new Set([" in text:
              print("Whitelist already patched")
              raise SystemExit(0)

          if marker not in text:
              raise SystemExit(
                  "Could not locate aggregate save marker"
              )

          text = text.replace(
              marker,
              whitelist + "\n          " + marker,
              1
          )

          path.write_text(text)
          PY

      - name: Restore health database
        working-directory: nexus
        run: |
          mkdir -p .data

          git fetch origin state:state --depth=1 2>/dev/null || true

          git show state:health.json \
            > .data/health.json 2>/dev/null || true

      - name: Install dependencies
        working-directory: nexus
        run: |
          npm ci

      - name: Verify ffprobe
        run: |
          ffprobe -version | head -1

      - name: Aggregate curated dataset
        working-directory: nexus
        run: |
          npm run cli -- aggregate

      - name: Probe health shard
        working-directory: nexus
        run: |
          npm run cli -- health \
            --shard-count 6 \
            --shard-index ${{ matrix.shard }} \
            --min-age 300

      - name: Upload health shard
        uses: actions/upload-artifact@v4
        with:
          name: health-shard-${{ matrix.shard }}
          path: nexus/.data/health.json
          retention-days: 1

  health-merge:
    name: Merge Health
    needs: health
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Dearbulut engine
        run: |
          git clone --depth 1 "$ENGINE_REPO" nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download health shards
        uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: health-shard-*

      - name: Merge health databases
        working-directory: nexus
        run: |
          mkdir -p .data

          node scripts/merge-health.mjs \
            ../shards \
            .data/health.json

      - name: Publish health state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: nexus
        run: |
          test -f .data/health.json

          chmod +x scripts/publish-state.sh

          ./scripts/publish-state.sh \
            "health: $(date -u +%FT%TZ)" \
            .data/health.json:health.json

  sync:
    name: Sync and Deploy
    needs:
      - epg
      - discovery
      - health-merge
    if: >
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.schedule == '15 0,6,12,18 * * *'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config directory
        run: |
          mkdir -p config

      - name: Clone Dearbulut engine
