name: Build and Deploy Guide

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create public directory
        run: |
          rm -rf public
          mkdir -p public

      - name: Download public channel sources
        run: |
          curl -L --fail \
            "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us.m3u" \
            -o current-us.m3u

          curl -L --fail \
            "https://iptv-org.github.io/iptv/cities/usnyc.m3u" \
            -o new-york.m3u

          curl -L --fail \
            "https://iptv-org.github.io/iptv/cities/usbos.m3u" \
            -o boston.m3u

          test -s current-us.m3u
          test -s new-york.m3u
          test -s boston.m3u

      - name: Build verified playlist
        run: |
          python <<'PY'
          import re
