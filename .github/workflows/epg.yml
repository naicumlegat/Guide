          def parse_m3u(path):
              entries = []

              lines = open(
                  path,
                  encoding="utf-8",
                  errors="ignore"
              ).read().splitlines()

              for i, line in enumerate(lines):

                  if not line.startswith("#EXTINF"):
                      continue

                  if i + 1 >= len(lines):
                      continue

                  url = lines[i + 1].strip()

                  if not url.startswith(
                      ("http://", "https://")
                  ):
                      continue

                  tvg = re.search(
                      r'tvg-id="([^"]*)"',
                      line
                  )

                  name = re.search(
                      r',(.+)$',
                      line
                  )

                  entries.append({
                      "id": tvg.group(1) if tvg else "",
                      "name": name.group(1).strip() if name else "",
                      "url": url,
                      "raw": line,
                  })

              return entries

          current = parse_m3u("current-us.m3u")
          ny = parse_m3u("new-york.m3u")
          bos = parse_m3u("boston.m3u")

          def is_hallmark_channel(text):
              text = text.upper()

              if "HALLMARK MYSTERY" in text:
                  return False

              if "HALLMARK FAMILY" in text:
                  return False

              if "HALLMARK MOVIES" in text:
                  return False

              return (
                  "HALLMARK CHANNEL" in text
                  or "USA_HALLMARK" in text
                  or "/HALLMARK/" in text
              )

          def is_real_fox(text):
              text = text.upper()

              bad = [
                  "FOX NEWS",
                  "FOX NEWS LIVE",
                  "FOX WEATHER",
                  "FOX BUSINESS",
                  "FOX SPORTS",
                  "FOX SOUL",
                  "FOX WEATHER",
                  "LIVE NOW",
              ]

              if any(x in text for x in bad):
                  return False

              return (
                  "FOX.US@" in text
                  or "FOX" in text
                  or "KDFW" in text
                  or "WUTV" in text
              )

          def candidate_matches(channel, entry):
              text = (
                  entry["id"]
                  + " "
                  + entry["name"]
                  + " "
                  + entry["url"]
              ).upper()

              if channel == "ABC":

                  if "ABC NEWS" in text:
                      return False

                  if "ABCNEWSLIVE" in text:
                      return False

                  return (
                      "ABC.US@" in text
                      or "WABC" in text
                      or "ABC_EAST" in text
                  )

              if channel == "CBS":
                  return "CBS" in text

              if channel == "NBC":
                  return (
                      "NBC" in text
                      and "NBC NEWS" not in text
                  )

              if channel == "FOX":
                  return is_real_fox(text)

              if channel == "The CW":
                  return (
                      "THE CW" in text
                      or "CW" in text
                      or "WPIX" in text
                  )

              if channel == "CNBC":
                  return "CNBC" in text

              if channel == "ESPN":
                  return (
                      "ESPN" in text
                      and "ESPN2" not in text
                      and "ESPNU" not in text
                  )

              if channel == "ESPN2":
                  return (
                      "ESPN2" in text
                      or "ESPN 2" in text
                  )

              if channel == "USA Network":
                  return (
                      "USA NETWORK" in text
                      or "USA_NETWORK" in text
                  )

              if channel == "TNT":
                  return "TNT" in text

              if channel == "TBS":
                  return "TBS" in text

              if channel == "FXX":
                  return "FXX" in text

              if channel == "Paramount Network":
                  return (
                      "PARAMOUNT NETWORK" in text
                      or "PARAMOUNT_NETWORK" in text
                      or "/PARAMOUNT/" in text
                  )

              if channel == "Comedy Central":
                  return "COMEDY CENTRAL" in text

              if channel == "TCM":
                  return (
                      "TCM" in text
                      or "TURNER CLASSIC MOVIES" in text
                  )

              if channel == "Hallmark Channel":
                  return is_hallmark_channel(text)

              if channel == "AMC":
                  return (
                      "AMC" in text
                      and "AMCHD" not in text
                  )

              if channel == "HGTV":
                  return "HGTV" in text

              if channel == "Disney Channel":
                  return (
                      "DISNEY CHANNEL" in text
                      or "USA_DISNEY" in text
                  )

              return False

          def collect_public_candidates(channel, name):

              found = []

              for entry in current:
                  if candidate_matches(channel, entry):
                      found.append(entry["url"])

              if channel in {
                  "ABC",
                  "CBS",
                  "NBC",
                  "FOX",
                  "The CW",
              }:

                  for entry in ny:
                      if candidate_matches(channel, entry):
                          found.append(entry["url"])

                  for entry in bos:
                      if candidate_matches(channel, entry):
                          found.append(entry["url"])

              found.extend(
                  alternatives.get(
                      next(
                          (
                              tvg_id
                              for tvg_id, group, cname, fallback
                              in channels
                              if cname == name
                          ),
                          ""
                      ),
                      []
                  )
              )

              return list(dict.fromkeys(found))

          def fetch(url):

              try:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                              "Mozilla/5.0 "
                              "(Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 "
                              "(KHTML, like Gecko) "
                              "Chrome/149.0 Safari/537.36",
                          "Accept": "*/*",
                          "Connection": "close",
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=12
                  ) as response:

                      if not (
                          200
                          <= response.status
                          < 400
                      ):
                          return False

                      content_type = (
                          response.headers.get(
                              "Content-Type",
                              ""
                          ).lower()
                      )

                      data = response.read(
                          32768
                      )

                      text = data.decode(
                          "utf-8",
                          errors="ignore"
                      )

                      # Reject HTML/error pages.
                      if "<html" in text.lower():
                          return False

                      if "<!doctype" in text.lower():
                          return False

                      # HLS master/media playlist.
                      if (
                          "#EXTM3U" in text
                          and (
                              "#EXT-X-" in text
                              or ".m3u8" in text
                              or ".ts" in text
                              or "#EXTINF" in text
                          )
                      ):
                          return True

                      # MPEG/TS or other recognized media.
                      if any(
                          x in content_type
                          for x in [
                              "video/",
                              "mpeg",
                              "octet-stream",
                              "application/vnd.apple.mpegurl",
                              "application/x-mpegurl",
                          ]
                      ):
                          return len(data) > 1024

                      return False

              except Exception:
                  return False

          # ============================================================
          # Build candidate lists.
          # ============================================================

          candidates = {}

          for (
              tvg_id,
              group,
              name,
              fallback
          ) in channels:

              if tvg_id in FROZEN:
                  candidates[tvg_id] = [fallback]
                  continue

              candidates[tvg_id] = list(
                  dict.fromkeys(
                      collect_public_candidates(
                          name,
                          name
                      )
                      + [fallback]
                  )
              )

          # ============================================================
          # Test everything concurrently.
          # ============================================================

          results = {}

          with concurrent.futures.ThreadPoolExecutor(
              max_workers=24
          ) as executor:

              jobs = {}

              for tvg_id, urls in candidates.items():

                  if tvg_id in FROZEN:
                      continue

                  for url in urls:
                      jobs[
                          (tvg_id, url)
                      ] = executor.submit(
                          fetch,
                          url
                      )

              for key, job in jobs.items():

                  try:
                      results[key] = job.result()
                  except Exception:
                      results[key] = False

          selected = {}

          print()
          print("========================================")
          print("VERIFIED STREAM SELECTION")
          print("========================================")
          print()

          for (
              tvg_id,
              group,
              name,
              fallback
          ) in channels:

              if tvg_id in FROZEN:

                  selected[tvg_id] = fallback

                  print(
                      f"FROZEN: {name}"
                  )

                  print(
                      f"        {fallback}"
                  )

                  continue

              chosen = None

              for url in candidates[tvg_id]:

                  if results.get(
                      (tvg_id, url),
                      False
                  ):

                      chosen = url
                      break

              if chosen is None:

                  print(
                      f"FAILED: {name}"
                  )

                  for url in candidates[tvg_id]:
                      print(
                          f"        tested: {url}"
                      )

                  raise SystemExit(
                      f"No verified stream found for {name}"
                  )

              selected[tvg_id] = chosen

              print(
                  f"VERIFIED: {name}"
              )

              print(
                  f"          {chosen}"
              )

          # ============================================================
          # Write playlist.
          # ============================================================

          with open(
              "public/channels.m3u",
              "w",
              encoding="utf-8"
          ) as f:

              f.write("#EXTM3U\n")

              for (
                  tvg_id,
                  group,
                  name,
                  fallback
              ) in channels:

                  f.write(
                      f'#EXTINF:-1 '
                      f'tvg-id="{tvg_id}" '
                      f'group-title="{group}",'
                      f'{name}\n'
                  )

                  f.write(
                      selected[tvg_id] + "\n"
                  )

          print()
          print(
              "Playlist channels:",
              len(channels)
          )
          PY

      - name: Download current US EPG
        run: |
          curl -L --fail \
            "https://vcicio.github.io/US-EPG/merged_epg.xml.gz" \
            -o epg.xml.gz

          test -s epg.xml.gz

      - name: Build filtered EPG
        run: |
          python <<'PY'
          import gzip
          import re
          import xml.etree.ElementTree as ET

          SOURCE = "epg.xml.gz"
          OUTPUT = "public/guide.xml"

          channels = {
              "ABC.us@East": [
                  "ABC",
                  "WABC",
                  "WABC-TV",
                  "ABC NEW YORK",
              ],

              "CBS.us@East": ["CBS"],

              "NBC.us@East": [
                  "NBC",
                  "WNBC",
                  "WNBC-TV",
              ],

              "Fox.us@East": [
                  "FOX",
                  "WUTV",
                  "WNYW",
                  "FOX NEW YORK",
              ],

              "TheCW.us@SD": [
                  "THE CW",
                  "CW",
                  "WPIX",
              ],

              "PBS.us@KQED": ["PBS"],

              "CNN.us@East": ["CNN"],

              "CNBC.us@East": ["CNBC"],

              "ESPN.us": ["ESPN"],

              "ESPN2.us": [
                  "ESPN2",
                  "ESPN 2",
              ],

              "USA.us@East": [
                  "USA NETWORK",
                  "USA",
              ],

              "TNT.us@East": ["TNT"],

              "TBS.us@East": ["TBS"],

              "FX.us@East": ["FX"],

              "FXX.us@East": ["FXX"],

              "ParamountNetwork.us@East": [
                  "PARAMOUNT NETWORK",
                  "PARAMOUNT",
              ],

              "SYFY.us@East": ["SYFY"],

              "Bravo.us@East": ["BRAVO"],

              "E.us@East": ["E!"],

              "Freeform.us@East": ["FREEFORM"],

              "DisneyChannel.us@East": [
                  "DISNEY CHANNEL",
                  "DISNEY",
              ],

              "Nickelodeon.us@East": [
                  "NICKELODEON"
              ],

              "CartoonNetwork.us@East": [
                  "CARTOON NETWORK"
              ],

              "ComedyCentral.us@East": [
                  "COMEDY CENTRAL"
              ],

              "TCM.us@East": [
                  "TURNER CLASSIC MOVIES",
                  "TCM",
              ],

              "HallmarkChannel.us@East": [
                  "HALLMARK CHANNEL"
              ],

              "AMC.us@East": ["AMC"],

              "HGTV.us@East": ["HGTV"],

              "GameShowNetwork.us@East": [
                  "GAME SHOW NETWORK",
                  "GSN",
              ],
          }

          def normalize(value):

              value = value or ""
              value = value.upper()
              value = value.replace(
                  "&AMP;",
                  "AND"
              )

              value = re.sub(
                  r"[^A-Z0-9!]+",
                  " ",
                  value
              )

              return re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()

          def names(channel):

              return [
                  normalize(node.text)
                  for node in channel.findall(
                      "display-name"
                  )
                  if node.text
              ]

          def score(candidate, aliases):

              cid = normalize(
                  candidate.get(
                      "id",
                      ""
                  )
              )

              display_names = names(
                  candidate
              )

              combined = " ".join(
                  [cid] + display_names
              )

              # Hard exclusions.

              if any(
                  x in combined
                  for x in [
                      "PACIFIC",
                      "WESTERN",
                      "WEST FEED",
                      "MOUNTAIN",
                      "CENTRAL",
                      "MIDWEST",
                  ]
              ):
                  return 0

              # Hallmark must be Hallmark Channel.
              if "HALLMARK" in " ".join(aliases):

                  if (
                      "HALLMARK MYSTERY"
                      in combined
                  ):
                      return 0

                  if (
                      "HALLMARK FAMILY"
                      in combined
                  ):
                      return 0

                  if (
                      "HALLMARK MOVIES"
                      in combined
                  ):
                      return 0

                  if (
                      "HALLMARK CHANNEL"
                      not in combined
                  ):
                      return 0

              # ABC must not become ABC News.
              if "ABC" in aliases:

                  if "ABC NEWS" in combined:
                      return 0

                  if "ABCNEWSLIVE" in combined:
                      return 0

              # FOX must not become Fox News.
              if "FOX" in aliases:

                  if "FOX NEWS" in combined:
                      return 0

                  if "FOX WEATHER" in combined:
                      return 0

                  if "FOX BUSINESS" in combined:
                      return 0

              best = 0

              for display_name in display_names:

                  for alias in aliases:

                      if display_name == alias:
                          best = max(
                              best,
                              1000
                          )

                      elif display_name.startswith(
                          alias + " "
                      ):
                          best = max(
                              best,
                              800
                          )

                      elif alias in display_name:
                          best = max(
                              best,
                              500
                          )

              if best == 0:
                  return 0

              if (
                  "EAST" in combined
                  or "EASTERN" in combined
              ):
                  best += 300

              if (
                  "WABC" in combined
                  and "ABC" in aliases
              ):
                  best += 500

              if (
                  "WNYW" in combined
                  and "FOX" in aliases
              ):
                  best += 500

              if (
                  "WUTV" in combined
                  and "FOX" in aliases
              ):
                  best += 500

              if (
                  "WNBC" in combined
                  and "NBC" in aliases
              ):
                  best += 500

              if (
                  "WNBC-TV" in combined
                  and "NBC" in aliases
              ):
                  best += 500

              return best

          with gzip.open(
              SOURCE,
              "rb"
          ) as f:

              tree = ET.parse(f)

          root = tree.getroot()

          source_channels = (
              root.findall("channel")
          )

          selected = {}

          print()
          print(
              "========================================"
          )
          print(
              "EPG CHANNEL MATCHING"
          )
          print(
              "========================================"
          )

          for target_id, aliases in channels.items():

              normalized_aliases = [
                  normalize(x)
                  for x in aliases
              ]

              best = None
              best_score = 0

              for candidate in source_channels:

                  candidate_score = score(
                      candidate,
                      normalized_aliases
                  )

                  if candidate_score > best_score:

                      best_score = (
                          candidate_score
                      )

                      best = candidate

              if best is None:

                  print(
                      f"SKIP: {target_id}"
                  )

                  continue

              selected[
                  target_id
              ] = best

              print(
                  f"MATCH: {target_id} <- "
                  f"{best.get('id', '')} "
                  f"score={best_score}"
              )

          if not selected:

              raise SystemExit(
                  "No EPG channels matched."
              )

          selected_elements = {
              id(item)
              for item in selected.values()
          }

          for channel in list(
              root.findall("channel")
          ):

              if id(channel) not in selected_elements:
                  root.remove(channel)

          source_to_target = {}

          for target_id, candidate in selected.items():

              source_id = candidate.get(
                  "id",
                  ""
              )

              candidate.set(
                  "id",
                  target_id
              )

              source_to_target[
                  source_id
              ] = target_id

          programme_count = 0

          for programme in list(
              root.findall("programme")
          ):

              source_id = programme.get(
                  "channel",
                  ""
              )

              if source_id not in source_to_target:

                  root.remove(programme)
                  continue

              programme.set(
                  "channel",
                  source_to_target[
                      source_id
                  ]
              )

              programme_count += 1

          if programme_count == 0:

              raise SystemExit(
                  "No EPG programmes found."
              )

          tree.write(
              OUTPUT,
              encoding="utf-8",
              xml_declaration=True
          )

          print()
          print(
              "EPG programmes:",
              programme_count
          )
          PY

      - name: Validate generated files
        run: |
          test -s public/channels.m3u
          test -s public/guide.xml

          CHANNEL_COUNT=$(
            grep -c '^#EXTINF' public/channels.m3u || true
          )

          PROGRAM_COUNT=$(
            grep -c '<programme ' public/guide.xml || true
          )

          echo "Playlist channels: $CHANNEL_COUNT"
          echo "EPG programmes: $PROGRAM_COUNT"

          if [ "$CHANNEL_COUNT" -ne 29 ]; then
            echo "ERROR: Expected 29 playlist channels."
            exit 1
          fi

          if ! grep -q '<tv' public/guide.xml; then
            echo "ERROR: guide.xml is not valid XMLTV."
            exit 1
          fi

          if [ "$PROGRAM_COUNT" -lt 1 ]; then
            echo "ERROR: guide.xml contains no programmes."
            exit 1
          fi

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lh public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
