            "nbc",
            "cbs",
            "abc",
            "fox",
            "pbs",
            "game show network",
            "history",
            "discovery",
            "amc",
            "fx",
            "syfy",
            "comedy central",
            "paramount",
            "paramount network",
            "mtv",
            "freeform",
            "hallmark movies & more",
            "hgtv",
            "bravo",
            "e!",
            "lifetime",
            "disney channel",
            "nickelodeon",
            "cartoon network",
            "fxx",
            "hbo",
            "hbo hits",
            "hbo movies",
            "starz",
            "starz cinema",
            "starz comedy",
            "cinemax",
            "showtime",
            "a&e",
            "bloomberg tv",
            "documentary+",
            "paramount+ picks",
            "paramount movie channel",
            "the jamie oliver channel",
            "the nanny"
          ]);

          const normalizeCuratedName = (value: string): string =>
