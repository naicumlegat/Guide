                      "CNBC East",
                      "https://stream.livenewsplay.com:9443/hls/cnbc/cnbcsd.m3u8"
                  ),
                  (
                      "CNBC.us@East",
                      "CNBC East",
                      "http://fl2.moveonjoy.com/CNBC/index.m3u8"
                  ),
              ],

              "ESPN": [
                  (
                      "ESPN.us",
                      "ESPN",
                      "http://fl1.moveonjoy.com/ESPN/index.m3u8"
                  ),
              ],

              "ESPN2": [
                  (
