name: Build Curated IPTV

on:
  schedule:
    - cron: "15 0,6,12,18 * * *"
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: curated-iptv
  cancel-in-progress: false

env:
  ENGINE_REPO: https://github.com/dearbulut/iptv.git

jobs:
  epg:
    name: EPG Grab
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config directory
        run: mkdir -p config

      - name: Clone Dearbulut engine
        run: git clone --depth 1 "$ENGINE_REPO" nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore discovered streams
        run: |
          mkdir -p nexus/config
          if [ -f config/discovered.m3u ]; then
            cp config/discovered.m3u nexus/config/discovered.m3u
          else
            printf '#EXTM3U\n' > nexus/config/discovered.m3u
          fi

      - name: Configure discovered source
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("config/sources.yml")
          text = path.read_text()
          repo = os.environ["GITHUB_REPOSITORY"]

          url = (
              f"https://raw.githubusercontent.com/"
              f"{repo}/main/config/discovered.m3u"
          )

          text = text.replace(
              "https://raw.githubusercontent.com/dearbulut/iptv/main/config/discovered.m3u",
              url
          )

          path.write_text(text)
          PY

      - name: Preserve stream feed identity
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aggregate/sources.ts")
          text = path.read_text()

          if "function splitChannelFeed(" not in text:
              marker = "interface JsonStreamShape {"

              helper = r'''
          function splitChannelFeed(value: string | null): {
            channel: string | null;
            feed: string | null;
          } {
            const valueTrimmed = value?.trim() ?? "";

            if (!valueTrimmed) {
              return {
                channel: null,
                feed: null,
              };
            }

            const at = valueTrimmed.indexOf("@");

            if (at <= 0 || at === valueTrimmed.length - 1) {
              return {
                channel: valueTrimmed,
                feed: null,
              };
            }

            return {
              channel: valueTrimmed.slice(0, at),
              feed: valueTrimmed.slice(at + 1),
            };
          }

          '''

              if marker not in text:
                  raise SystemExit(
                      "Could not locate sources.ts insertion point"
                  )

              text = text.replace(marker, helper + marker, 1)

          old = """      const title = entry.title ?? entry.name ?? '';
          push({
            channel: entry.channel ?? entry.tvg_id ?? null,
            feed: entry.feed ?? null,"""

          new = """      const identity = splitChannelFeed(
            entry.channel ?? entry.tvg_id ?? null
          );

          push({
            channel: identity.channel,
            feed: entry.feed ?? identity.feed,"""

          if old in text:
              text = text.replace(old, new, 1)

          old = """      const tvgId = entry.attributes['tvg-id']?.trim() || null;
          const title = entry.title || entry.attributes['tvg-name'] || '';
          push({
            channel: tvgId,
            feed: null,"""

          new = """      const tvgId = entry.attributes['tvg-id']?.trim() || null;
          const identity = splitChannelFeed(tvgId);
          const title = entry.title || entry.attributes['tvg-name'] || '';

          push({
            channel: identity.channel,
            feed: identity.feed,"""

          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Apply channel whitelist
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aggregate/index.ts")
          text = path.read_text()

          marker = "await saveDataset(dataset);"

          whitelist = r'''
          const CURATED_NAMES = new Set([
            "abc",
            "fox",
            "game show network",
            "history",
            "discovery",
            "amc",
            "fx",
            "syfy",
            "comedy central",
            "paramount",
            "paramount network",
            "mtv",
            "freeform",
            "hallmark movies & more",
            "hgtv",
            "bravo",
            "e!",
            "lifetime",
            "disney channel",
            "nickelodeon",
            "cartoon network",
            "fxx",
            "hbo",
            "hbo hits",
            "hbo movies",
            "starz cinema",
            "starz comedy",
            "cinemax",
            "showtime",
            "a&e",
            "bloomberg tv",
            "documentary+",
            "paramount+ picks",
            "paramount movie channel",
            "the jamie oliver channel",
            "the nanny"
          ]);

          const normalizeCuratedName = (value: string): string =>
            value
              .trim()
              .toLowerCase()
              .replace(/\s+/g, " ");

          const isCanThoTV2 = (channel: any): boolean => {
            const channelId = String(
              channel.id ?? ""
            ).trim().toLowerCase();

            const names = [
              channel.name,
              ...(channel.alt_names ?? []),
            ].map(normalizeCuratedName);

            return (
              channelId.includes("cantho") ||
              channelId.includes("can-tho") ||
              names.some((name) =>
                name.includes("can tho tv 2") ||
                name.includes("cantho tv 2") ||
                name.includes("can-tho tv 2")
              )
            );
          };

          const isMiamiABC = (channel: any): boolean => {
            const channelId = String(
              channel.id ?? ""
            ).trim().toLowerCase();

            const names = [
              channel.name,
              ...(channel.alt_names ?? []),
            ].map(normalizeCuratedName);

            return (
              channelId.includes("wplg") ||
              names.some((name) =>
                name.includes("wplg") ||
                name.includes("miami")
              )
            );
          };

          dataset.channels = dataset.channels.filter((channel) => {
            if (isCanThoTV2(channel)) return false;

            const names = [
              channel.name,
              ...(channel.alt_names ?? []),
            ].map(normalizeCuratedName);

            const isCurated = names.some((name) =>
              CURATED_NAMES.has(name)
            );

            if (!isCurated) return false;

            if (names.includes("abc")) {
              return (
                channel.country === "US" &&
                isMiamiABC(channel)
              );
            }

            if (names.includes("hgtv")) return true;

            return channel.country === "US";
          });

          dataset.orphans = [];

          log.info(
            `Curated US whitelist: ${dataset.channels.length} channel(s)`
          );
          '''

          if "const CURATED_NAMES = new Set([" in text:
              print("Whitelist already patched")
              raise SystemExit(0)

          if marker not in text:
              raise SystemExit(
                  "Could not locate aggregate save marker"
              )

          text = text.replace(
              marker,
              whitelist + "\n          " + marker,
              1
          )

          path.write_text(text)
          PY

      - name: Restore health database
        working-directory: nexus
        run: |
          mkdir -p .data
          git fetch origin state:state --depth=1 2>/dev/null || true
          git show state:health.json > .data/health.json 2>/dev/null || true

      - name: Install Dearbulut dependencies
        working-directory: nexus
        run: npm ci

      - name: Aggregate curated dataset
        working-directory: nexus
        run: npm run cli -- aggregate

      - name: Clone iptv-org EPG grabber
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg

      - name: Install EPG dependencies
        working-directory: epg
        run: npm install --no-audit --no-fund

      - name: Build all curated EPG source mappings
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          dataset_path = Path("nexus/.data/channels.json")
          epg_sites = Path("epg/sites")
          output = Path("epg/custom/all-curated-us.channels.xml")

          dataset = json.loads(dataset_path.read_text())

          curated_ids = {
              str(channel.get("id", "")).strip()
              for channel in dataset.get("channels", [])
              if channel.get("id")
          }

          if not curated_ids:
              raise SystemExit("No curated channel IDs found.")

          print("========================================")
          print("BUILD ALL CURATED EPG MAPPINGS")
          print("========================================")
          print(f"Curated channel IDs: {len(curated_ids)}")

          root = ET.Element("channels")
          seen = set()
          total = 0
          source_files = 0

          for channels_file in sorted(epg_sites.rglob("*.channels.xml")):
              try:
                  source_root = ET.parse(channels_file).getroot()
              except Exception as exc:
                  print(f"Skipping unreadable {channels_file}: {exc}")
                  continue

              matched_file = 0

              for channel in source_root.findall("channel"):
                  xmltv_id = (channel.get("xmltv_id") or "").strip()

                  if not xmltv_id:
                      continue

                  base_id = xmltv_id.split("@", 1)[0].strip()

                  if base_id not in curated_ids:
                      continue

                  site = (channel.get("site") or "").strip()
                  site_id = (channel.get("site_id") or "").strip()
                  lang = (channel.get("lang") or "en").strip()

                  if not site or not site_id:
                      continue

                  key = (site, site_id, lang, xmltv_id)

                  if key in seen:
                      continue

                  seen.add(key)

                  new_channel = ET.SubElement(
                      root,
                      "channel",
                      {
                          "site": site,
                          "site_id": site_id,
                          "lang": lang,
                          "xmltv_id": xmltv_id,
                      },
                  )

                  new_channel.text = (
                      channel.text or base_id
                  ).strip()

                  matched_file += 1
                  total += 1

              if matched_file:
                  source_files += 1
                  print(
                      f"{channels_file}: "
                      f"{matched_file} matching mapping(s)"
                  )

          if total == 0:
              raise SystemExit(
                  "No EPG mappings matched the curated channel IDs."
              )

          output.parent.mkdir(parents=True, exist_ok=True)

          try:
              ET.indent(root, space="  ")
          except AttributeError:
              pass

          ET.ElementTree(root).write(
              output,
              encoding="utf-8",
              xml_declaration=True,
          )

          print("----------------------------------------")
          print(f"EPG source files matched: {source_files}")
          print(f"Total EPG mappings: {total}")
          print(f"Output: {output}")
          print("========================================")
          PY

      - name: Grab all curated EPG sources
        run: |
          set -e
          mkdir -p guides

          rm -f epg/guide.xml
          rm -f epg/guide.xml.gz

          echo "========================================"
          echo "GRAB ALL CURATED EPG SOURCES"
          echo "========================================"

          (
            cd epg
            NODE_OPTIONS="--max-old-space-size=8192" npm run grab -- \
              --channels="custom/all-curated-us.channels.xml" \
              --output=guide.xml \
              --days=3 \
              --timeout=30000 \
              --maxConnections=12 \
              --gzip
          ) || true

          if [ ! -s epg/guide.xml ]; then
            echo "No combined EPG guide was produced."
            exit 1
          fi

          programmes=$(grep -c '<programme' epg/guide.xml || true)

          if [ "${programmes:-0}" -lt 1 ]; then
            echo "No EPG programmes were produced."
            exit 1
          fi

          if [ -f epg/guide.xml.gz ]; then
            cp epg/guide.xml.gz guides/all-curated-us.xml.gz
          else
            gzip -9 -c epg/guide.xml > guides/all-curated-us.xml.gz
          fi

          echo "Programs collected: $programmes"

      - name: Publish EPG state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: nexus
        run: |
          cp -R ../guides ./guides
          chmod +x scripts/publish-state.sh

          for attempt in 1 2 3 4 5; do
            echo "Publishing EPG state, attempt $attempt"

            if ./scripts/publish-state.sh \
              "epg: $(date -u +%FT%TZ)" \
              guides/:epg/; then
              echo "EPG state published successfully"
              exit 0
            fi

            echo "State branch changed during publish"

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 3))
              git fetch origin state:state --force
            fi
          done

          echo "Failed to publish EPG state after 5 attempts"
          exit 1

