            > .data/health.json 2>/dev/null || true

      - name: Install dependencies
        working-directory: nexus
        run: |
          npm ci

      - name: Verify ffprobe
        run: |
          ffprobe -version | head -1

      - name: Aggregate curated dataset
        working-directory: nexus
        run: |
          npm run cli -- aggregate

      - name: Probe health shard
        working-directory: nexus
        run: |
          npm run cli -- health \
            --shard-count 6 \
            --shard-index ${{ matrix.shard }} \
            --min-age 300

      - name: Upload health shard
        uses: actions/upload-artifact@v4
        with:
          name: health-shard-${{ matrix.shard }}
          path: nexus/.data/health.json
          retention-days: 1


  health-merge:
    name: Merge Health
    needs: health
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Dearbulut engine
        run: |
          git clone --depth 1 "$ENGINE_REPO" nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download health shards
        uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: health-shard-*

      - name: Merge health databases
        working-directory: nexus
        run: |
          mkdir -p .data

          node scripts/merge-health.mjs \
            ../shards \
            .data/health.json

      - name: Publish health state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: nexus
        run: |
          test -f .data/health.json

          chmod +x scripts/publish-state.sh

          ./scripts/publish-state.sh \
            "health: $(date -u +%FT%TZ)" \
            .data/health.json:health.json


  sync:
    name: Sync and Deploy
    needs:
      - epg
      - discovery
      - health-merge
    if: >
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.schedule == '15 0,6,12,18 * * *'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config directory
        run: |
          mkdir -p config

      - name: Clone Dearbulut engine
        run: |
