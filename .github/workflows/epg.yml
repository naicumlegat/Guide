                  "http://main.light-ott.net:80/play/live.php?mac=A0:BB:3E:00:01:FC&stream=855462&extension=ts",
              ],
              "FX.us@East": [
                  "http://143.244.60.30/FX/index.m3u8",
                  "http://23.237.104.106:8080/USA_FX/index.m3u8",
              ],
              "FXX.us@East": [
                  "http://livex.pop-app.live/s4n/poplive/ch523/playlist.m3u8",
