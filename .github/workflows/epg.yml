      - name: Restore discovery rejection memory
        working-directory: nexus
        run: |
          mkdir -p .data
          git fetch origin state:state --depth=1 2>/dev/null || true
          git show state:discovery.json > .data/discovery.json 2>/dev/null || true

      - name: Install dependencies
        working-directory: nexus
        run: npm ci

      - name: Verify ffprobe
        run: ffprobe -version | head -1

      - name: Aggregate curated dataset
        working-directory: nexus
        run: npm run cli -- aggregate

      - name: Discover and verify replacements
        working-directory: nexus
        run: |
          npm run cli -- discover \
            --max-probes 800 \
            --apply

      - name: Copy discovered streams back
        run: |
          mkdir -p config
          cp nexus/config/discovered.m3u config/discovered.m3u

      - name: Commit discovered streams
        run: |
          if git diff --quiet -- config/discovered.m3u; then
            echo "No new discovered streams"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/discovered.m3u
          git commit -m "discovery: update curated streams"

          git pull --rebase --quiet origin main || true
          git push origin HEAD:main

      - name: Persist discovery rejection memory
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: nexus
        run: |
          if [ ! -f .data/discovery.json ]; then
            exit 0
          fi

          chmod +x scripts/publish-state.sh

          for attempt in 1 2 3 4 5; do
            echo "Publishing discovery state, attempt $attempt"

            if ./scripts/publish-state.sh \
              "discovery: $(date -u +%FT%TZ)" \
              .data/discovery.json:discovery.json; then
              echo "Discovery state published successfully"
              exit 0
            fi

            echo "State branch changed during publish"

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 3))
              git fetch origin state:state --force
            fi
          done

          echo "Failed to publish discovery state after 5 attempts"
          exit 1

