            "a&e",
            "bloomberg tv",
            "documentary+",
            "paramount+ picks",
            "paramount movie channel",
            "the jamie oliver channel",
            "the nanny"
          ]);

          const normalizeCuratedName = (value: string): string =>
            value
              .trim()
              .toLowerCase()
              .replace(/\s+/g, " ");

          dataset.channels = dataset.channels.filter((channel) => {
            const names = [
              channel.name,
              ...channel.alt_names,
            ].map(normalizeCuratedName);

            const isCurated = names.some((name) =>
              CURATED_NAMES.has(name)
            );

            if (!isCurated) return false;

            if (names.includes("hgtv")) return true;

            return channel.country === "US";
          });

          dataset.orphans = [];

          log.info(
            `Curated US whitelist: ${dataset.channels.length} channel(s)`
          );
          '''

          if "const CURATED_NAMES = new Set([" in text:
              print("Whitelist already patched")
              raise SystemExit(0)

          if marker not in text:
              raise SystemExit(
                  "Could not locate aggregate save marker"
              )

          text = text.replace(
              marker,
              whitelist + "\n          " + marker,
              1
          )

          path.write_text(text)
          PY

      - name: Install dependencies
        working-directory: nexus
        run: |
          npm ci

      - name: Verify ffprobe
        run: |
          ffprobe -version | head -1

      - name: Aggregate
        working-directory: nexus
        env:
          NEXUS_BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXUS_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm run cli -- aggregate

      - name: Build merged EPG
        working-directory: nexus
        env:
          NEXUS_BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXUS_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm run cli -- epg

      - name: Build API and playlists
        working-directory: nexus
        env:
          NEXUS_BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXUS_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm run cli -- api --clean

      - name: Create simple playlist URLs
        run: |
          mkdir -p nexus/public

          if [ -f nexus/public/playlists/best.m3u ]; then
            cp nexus/public/playlists/best.m3u \
              nexus/public/channels.m3u
          fi

          if [ -f nexus/public/epg/guide.xml ]; then
            cp nexus/public/epg/guide.xml \
              nexus/public/guide.xml
          fi

      - name: Show curated result
        working-directory: nexus
        run: |
          echo "========================================"
          echo "CURATED US CHANNELS"
          echo "========================================"

          grep '^#EXTINF' public/channels.m3u \
            | sed 's/.*,//' \
            || true

          echo
          echo "Channel count:"
          grep -c '^#EXTINF' public/channels.m3u \
            || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nexus/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
