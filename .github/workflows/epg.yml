          git fetch origin state:state --depth=1 2>/dev/null || true

          echo "========================================"
          echo "RESTORE EPG STATE"
          echo "========================================"

          mapfile -t epg_files < <(
            git ls-tree -r --name-only state epg/ 2>/dev/null \
              | grep -E '^epg/[^/]+\.xml\.gz$' \
              || true
          )

          if [ "${#epg_files[@]}" -eq 0 ]; then
            echo "No EPG files found in state/epg/"
            exit 1
          fi

          restored=0

          for state_file in "${epg_files[@]}"; do
            filename="${state_file#epg/}"

            git show "state:${state_file}" \
              > "epg-state/${filename}"

            if [ -s "epg-state/${filename}" ]; then
              echo "Restored ${state_file}"
              restored=$((restored + 1))
