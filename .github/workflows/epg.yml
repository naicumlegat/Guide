name: Build and Deploy Guide

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create public directory
        run: |
          rm -rf public
          mkdir -p public

      - name: Download current US EPG
        run: |
          curl -L --fail \
            "https://vcicio.github.io/US-EPG/merged_epg.xml.gz" \
            -o epg.xml.gz

          test -s epg.xml.gz
          ls -lh epg.xml.gz

      - name: Build filtered EPG
        run: |
          python <<'PY'
          import gzip
          import re
          import xml.etree.ElementTree as ET

          SOURCE = "epg.xml.gz"
          OUTPUT = "public/guide.xml"

          channels = {
              "ABC.us@East": ["ABC"],
              "CBS.us@East": ["CBS"],
              "NBC.us@East": ["NBC"],
              "Fox.us@East": ["FOX"],
              "TheCW.us@SD": ["THE CW", "CW"],
              "PBS.us@KQED": ["PBS"],
              "CNN.us@East": ["CNN"],
              "FoxNewsChannel.us@SD": ["FOX NEWS", "FOX NEWS CHANNEL"],
              "CNBC.us@East": ["CNBC"],
              "ESPN.us": ["ESPN"],
              "ESPN2.us": ["ESPN2", "ESPN 2"],
              "USA.us@East": ["USA NETWORK"],
              "TNT.us@East": ["TNT"],
              "TBS.us@East": ["TBS"],
              "FX.us@East": ["FX"],
              "FXX.us@East": ["FXX"],
              "ParamountNetwork.us@East": ["PARAMOUNT NETWORK"],
              "SYFY.us@East": ["SYFY"],
              "Bravo.us@East": ["BRAVO"],
              "E.us@East": ["E!"],
              "Freeform.us@East": ["FREEFORM"],
              "DisneyChannel.us@East": ["DISNEY CHANNEL"],
              "Nickelodeon.us@East": ["NICKELODEON"],
              "CartoonNetwork.us@East": ["CARTOON NETWORK"],
              "ComedyCentral.us@East": ["COMEDY CENTRAL"],
              "TCM.us@East": ["TURNER CLASSIC MOVIES", "TCM"],
              "HallmarkChannel.us@East": ["HALLMARK CHANNEL", "HALLMARK"],
              "AMC.us@East": ["AMC"],
              "GameShowNetwork.us@East": ["GAME SHOW NETWORK", "GSN"],
              "HGTV.us@East": ["HGTV"],
          }

          def normalize(value):
              value = value or ""
              value = value.upper()
              value = value.replace("&AMP;", "AND")
              value = re.sub(r"[^A-Z0-9!]+", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def get_names(channel):
              result = []

              for node in channel.findall("display-name"):
                  if node.text:
                      result.append(normalize(node.text))

              return result

          def score_candidate(candidate, aliases):
              channel_id = normalize(candidate["id"])
              names = candidate["names"]

              combined = " ".join([channel_id] + names)

              # Never use the wrong time-zone feed.
              forbidden = [
                  "PACIFIC",
                  "WESTERN",
                  "WEST FEED",
                  "MOUNTAIN",
                  "CENTRAL FEED",
                  "MIDWEST",
              ]

              for word in forbidden:
                  if word in combined:
                      return 0

              # Normalized IDs no longer contain the dot.
              if "US2" in channel_id:
                  return 0

              # Never use AMC+ as AMC.
              if "AMC+" in combined or "AMC PLUS" in combined:
                  return 0

              score = 0

              for name in names:
                  for alias in aliases:
                      if name == alias:
                          score = max(score, 1000)

                      elif name.startswith(alias + " "):
                          score = max(score, 800)

                      elif alias in name:
                          score = max(score, 500)

              if score == 0:
                  return 0

              # Prefer explicit Eastern feeds.
              eastern = [
                  "EASTERN",
                  "EAST",
                  "EAST FEED",
              ]

              for term in eastern:
                  if term in combined:
                      score += 300

              # Prefer US1 where applicable.
              if "US1" in channel_id:
                  score += 250

              return score

          with gzip.open(SOURCE, "rb") as f:
              tree = ET.parse(f)

          root = tree.getroot()

          source_channels = []

          for channel in root.findall("channel"):
              source_channels.append({
                  "element": channel,
                  "id": channel.get("id", ""),
                  "names": get_names(channel)
              })

          selected = {}
          used_source_ids = set()

          for target_id, aliases in channels.items():
              aliases = [normalize(x) for x in aliases]

              best = None
              best_score = 0

              for candidate in source_channels:
                  if candidate["id"] in used_source_ids:
                      continue

                  score = score_candidate(candidate, aliases)

                  if score > best_score:
                      best_score = score
                      best = candidate

              if best is not None:
                  selected[target_id] = best
                  used_source_ids.add(best["id"])

          print()
          print("Requested channels:", len(channels))
          print("Matched channels:", len(selected))
          print()

          for target_id in channels:
              if target_id in selected:
                  candidate = selected[target_id]

                  print(
                      "MATCH:",
                      target_id,
                      "<-",
                      candidate["id"],
                      "|",
                      " / ".join(candidate["names"])
                  )
              else:
                  print("SKIP:", target_id)

          # Keep only successfully matched channels.
          selected_elements = {
              id(candidate["element"])
              for candidate in selected.values()
          }

          for channel in list(root.findall("channel")):
              if id(channel) not in selected_elements:
                  root.remove(channel)

          # Change source IDs to the exact IDs used by channels.m3u.
          source_to_target = {}

          for target_id, candidate in selected.items():
              source_id = candidate["id"]

              candidate["element"].set("id", target_id)

              source_to_target[source_id] = target_id

          # Keep programmes belonging to matched channels only.
          programme_count = 0

          for programme in list(root.findall("programme")):
              source_id = programme.get("channel")

              if source_id in source_to_target:
                  programme.set(
                      "channel",
                      source_to_target[source_id]
                  )
                  programme_count += 1
              else:
                  root.remove(programme)

          print()
          print("Matched channels:", len(selected))
          print("Programme entries:", programme_count)

          if not selected:
              raise SystemExit(
                  "ERROR: No channels were matched."
              )

          if programme_count == 0:
              raise SystemExit(
                  "ERROR: No programme entries were found."
              )

          tree.write(
              OUTPUT,
              encoding="utf-8",
              xml_declaration=True
          )

          print()
          print("Created:", OUTPUT)
          PY

      - name: Validate EPG
        run: |
          test -s public/guide.xml

          if ! grep -q "<tv" public/guide.xml; then
            echo "ERROR: guide.xml is not a valid XMLTV document."
            exit 1
          fi

          PROGRAM_COUNT=$(grep -c "<programme " public/guide.xml || true)

          echo "EPG programme entries: $PROGRAM_COUNT"

          if [ "$PROGRAM_COUNT" -lt 1 ]; then
            echo "ERROR: guide.xml contains no programme entries."
            exit 1
          fi

      - name: Copy playlist
        run: |
          if [ ! -f channels.m3u ]; then
            echo "ERROR: channels.m3u was not found."
            exit 1
          fi

          cp channels.m3u public/channels.m3u

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lh public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
