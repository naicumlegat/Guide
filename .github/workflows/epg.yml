name: Build Curated IPTV

on:
  schedule:
    - cron: "15 0,6,12,18 * * *"
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: curated-iptv
  cancel-in-progress: false

env:
  ENGINE_REPO: https://github.com/dearbulut/iptv.git

jobs:

  epg:
    name: EPG Grab
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Dearbulut engine
        run: |
          git clone --depth 1 "$ENGINE_REPO" nexus

      - name: Get EPG site list
        working-directory: nexus
        run: |
          node scripts/epg-sites.mjs matrix > /tmp/epg-matrix.json
          cat /tmp/epg-matrix.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clone iptv-org EPG grabber
        run: |
          git clone --depth 1 -b master \
            https://github.com/iptv-org/epg.git epg

      - name: Install EPG dependencies
        working-directory: epg
        run: |
          npm install --no-audit --no-fund

      - name: Restrict EPG channels to USA
        working-directory: epg
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          files = list(Path("sites").glob("**/*.channels.xml"))

          total_before = 0
          total_after = 0
          files_changed = 0

          for path in files:
              try:
                  tree = ET.parse(path)
                  root = tree.getroot()

                  removed = 0
                  kept = 0

                  for channel in list(root.findall("channel")):
                      xmltv_id = (
                          channel.attrib.get("xmltv_id")
                          or channel.attrib.get("id")
                          or ""
                      ).strip()

                      total_before += 1

                      if re.search(r"\.us(?:@|$)", xmltv_id, re.IGNORECASE):
                          kept += 1
                          total_after += 1
                      else:
                          root.remove(channel)
                          removed += 1

                  if removed:
                      tree.write(
                          path,
                          encoding="utf-8",
                          xml_declaration=True
                      )
                      files_changed += 1

                  if kept or removed:
                      print(
                          f"{path}: kept {kept}, removed {removed}"
                      )

              except ET.ParseError as e:
                  print(f"Skipping invalid XML: {path}: {e}")

          print()
          print("========================================")
          print("USA EPG CHANNEL FILTER")
          print("========================================")
          print(f"Files checked: {len(files)}")
          print(f"Files changed: {files_changed}")
          print(f"Channels before: {total_before}")
          print(f"USA channels kept: {total_after}")
          print(f"Non-USA channels removed: {total_before - total_after}")
          print("========================================")
          PY

      - name: Grab EPG sources
        run: |
          set -e

          mkdir -p guides

          sites=$(node - <<'NODE'
          const fs = require("fs");

          const text = fs.readFileSync(
            "nexus/config/epg-grab.yml",
            "utf8"
          );

          const sites = [];
          let current = null;

          for (const raw of text.split(/\r?\n/)) {
            const line = raw.replace(/\s+#.*$/, "").trimEnd();

            if (!line.trim() || line.trim().startsWith("#")) {
              continue;
            }

            if (line.trim() === "sites:") {
              continue;
            }

            const item = /^\s*-\s*(.*)$/.exec(line);

            if (item) {
              if (current && current.site && current.enabled !== false) {
                sites.push(current);
              }

              current = {};

              if (item[1]) {
                const m = /^([A-Za-z_][\w-]*)\s*:\s*(.*)$/.exec(item[1]);

                if (m) {
                  current[m[1]] = m[2].replace(/^['"]|['"]$/g, "");
                }
              }

              continue;
            }

            if (current) {
              const m = /^([A-Za-z_][\w-]*)\s*:\s*(.*)$/.exec(
                line.trim()
              );

              if (!m) {
                continue;
              }

              let value = m[2].trim();

              if (value === "true") {
                value = true;
              } else if (value === "false") {
                value = false;
              } else if (/^-?\d+$/.test(value)) {
                value = Number(value);
              } else {
                value = value.replace(/^['"]|['"]$/g, "");
              }

              current[m[1]] = value;
            }
          }

          if (current && current.site && current.enabled !== false) {
            sites.push(current);
          }

          for (const site of sites) {
            console.log(
              [
                site.site,
                site.slug ||
                  String(site.site).replace(/[^a-z0-9]+/gi, "-"),
                site.timeout || 30000,
                site.max_connections || 8
              ].join("|")
            );
          }
          NODE
          )

          while IFS="|" read -r site slug timeout connections; do
            [ -z "$site" ] && continue

            echo "========================================"
            echo "EPG: $site"
            echo "========================================"

            rm -rf epg/out
            mkdir -p epg/out

            (
              cd epg

              npm run grab -- \
                --sites="$site" \
                --output=guide.xml \
                --days=3 \
                --timeout="$timeout" \
                --maxConnections="$connections" \
                --gzip
            ) || true

            if [ ! -s epg/guide.xml ]; then
              echo "No guide produced for $site"
              continue
            fi

            programmes=$(grep -c '<programme' epg/guide.xml || true)

            if [ "${programmes:-0}" -lt 1 ]; then
              echo "No programmes produced for $site"
              continue
            fi

            if [ -f epg/guide.xml.gz ]; then
              cp epg/guide.xml.gz \
                "guides/${slug}.xml.gz"
            else
              gzip -9 -c epg/guide.xml > \
                "guides/${slug}.xml.gz"
            fi

            echo "Saved $site"
          done <<< "$sites"

      - name: Publish EPG state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: nexus
        run: |
          cp -R ../guides ./guides

          chmod +x scripts/publish-state.sh

          ./scripts/publish-state.sh \
            "epg: $(date -u +%FT%TZ)" \
            guides/:epg/


  discovery:
    name: Discover Streams
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config directory
        run: |
          mkdir -p config

      - name: Clone Dearbulut engine
        run: |
          git clone --depth 1 "$ENGINE_REPO" nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore discovered streams
        run: |
          mkdir -p nexus/config

          if [ -f config/discovered.m3u ]; then
            cp config/discovered.m3u \
              nexus/config/discovered.m3u
          else
            printf '#EXTM3U\n' > nexus/config/discovered.m3u
          fi

      - name: Configure discovered source
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("config/sources.yml")
          text = path.read_text()

          repo = os.environ["GITHUB_REPOSITORY"]

          url = (
              f"https://raw.githubusercontent.com/"
              f"{repo}/main/config/discovered.m3u"
          )

          text = text.replace(
              "https://raw.githubusercontent.com/dearbulut/iptv/main/config/discovered.m3u",
              url
          )

          path.write_text(text)
          PY

      - name: Apply channel whitelist
        working-directory: nexus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/aggregate/index.ts")
          text = path.read_text()

          marker = "await saveDataset(dataset);"

          whitelist = r'''
          const CURATED_NAMES = new Set([
            "nbc",
            "cbs",
            "abc",
            "fox",
            "pbs",
            "game show network",
            "history",
            "discovery",
            "amc",
            "fx",
            "syfy",
            "comedy central",
            "paramount",
            "paramount network",
            "mtv",
            "freeform",
            "hallmark movies & more",
            "hgtv",
            "bravo",
            "e!",
            "lifetime",
            "disney channel",
            "nickelodeon",
            "cartoon network",
            "fxx",
            "hbo",
            "hbo hits",
            "hbo movies",
            "starz",
            "starz cinema",
            "starz comedy",
            "cinemax",
            "showtime",
            "a&e",
            "bloomberg tv",
            "documentary+",
            "paramount+ picks",
            "paramount movie channel",
            "the jamie oliver channel",
            "the nanny"
          ]);

          const normalizeCuratedName = (value: string): string =>
            value
              .trim()
              .toLowerCase()
              .replace(/\s+/g, " ");

          dataset.channels = dataset.channels.filter((channel) => {
            const names = [
              channel.name,
              ...channel.alt_names,
            ].map(normalizeCuratedName);

            return names.some((name) => CURATED_NAMES.has(name));
          });

          dataset.orphans = [];

          log.info(
            `Curated US whitelist: ${dataset.channels.length} channel(s)`
          );
          '''

          if "const CURATED_NAMES = new Set([" in text:
              print("Whitelist already patched")
              raise SystemExit(0)

          if marker not in text:
              raise SystemExit(
                  "Could not locate aggregate save marker"
              )

          text = text.replace(
              marker,
              whitelist + "\n          " + marker,
              1
          )

          path.write_text(text)
          PY

      - name: Restore discovery rejection memory
        working-directory: nexus
        run: |
          mkdir -p .data

          git fetch origin state:state --depth=1 2>/dev/null || true

          git show state:discovery.json \
            > .data/discovery.json 2>/dev/null || true

      - name: Install dependencies
        working-directory: nexus
        run: |
          npm ci

      - name: Verify ffprobe
        run: |
          ffprobe -version | head -1

      - name: Aggregate curated dataset
        working-directory: nexus
        run: |
          npm run cli -- aggregate

      - name: Discover and verify replacements
        working-directory: nexus
        run: |
          npm run cli -- discover \
            --max-probes 800 \
            --apply

      - name: Copy discovered streams back
        run: |
          mkdir -p config

          cp nexus/config/discovered.m3u \
            config/discovered.m3u

      - name: Commit discovered streams
        run: |
          if git diff --quiet -- config/discovered.m3u; then
            echo "No new discovered streams"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/discovered.m3u

          git commit \
            -m "discovery: update curated streams"

          git pull --rebase --quiet origin main || true

          git push origin HEAD:main

      - name: Persist discovery rejection memory
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: nexus
        run: |
          if [ ! -f .data/discovery.json ]; then
            exit 0
          fi

          chmod +x scripts/publish-state.sh

          ./scripts/publish-state.sh \
            "discovery: $(date -u +%FT%TZ)" \
            .data/discovery.json:discovery.json


