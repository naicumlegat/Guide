name: Build and Deploy Guide

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create public directory
        run: |
          rm -rf public
          mkdir -p public

      - name: Download current US EPG
        run: |
          curl -L --fail \
            "https://vcicio.github.io/US-EPG/merged_epg.xml.gz" \
            -o epg.xml.gz

          test -s epg.xml.gz
          ls -lh epg.xml.gz

      - name: Build filtered EPG
        run: |
          python <<'PY'
          import gzip
          import re
          import xml.etree.ElementTree as ET

          SOURCE = "epg.xml.gz"
          OUTPUT = "public/guide.xml"

          channels = {
              "ABC.us@East": [
                  "ABC",
                  "ABC EAST",
                  "ABC NETWORK",
                  "ABC EAST FEED"
              ],
              "CBS.us@East": [
                  "CBS",
                  "CBS EAST",
                  "CBS NETWORK",
                  "CBS EAST FEED"
              ],
              "NBC.us@East": [
                  "NBC",
                  "NBC EAST",
                  "NBC NETWORK",
                  "NBC EAST FEED"
              ],
              "Fox.us@East": [
                  "FOX",
                  "FOX EAST",
                  "FOX NETWORK",
                  "FOX EAST FEED"
              ],
              "TheCW.us@SD": [
                  "THE CW",
                  "CW",
                  "CW EAST",
                  "THE CW EAST"
              ],
              "PBS.us@KQED": [
                  "PBS",
                  "PBS EAST",
                  "PBS NETWORK",
                  "PBS NETWORK HD",
                  "PBS EASTERN"
              ],
              "CNN.us@East": [
                  "CNN",
                  "CNN EAST",
                  "CNN EAST FEED"
              ],
              "FoxNewsChannel.us@SD": [
                  "FOX NEWS",
                  "FOX NEWS CHANNEL",
                  "FOX NEWS EAST",
                  "FOX NEWS CHANNEL EAST"
              ],
              "CNBC.us@East": [
                  "CNBC",
                  "CNBC EAST",
                  "CNBC EAST FEED"
              ],
              "ESPN.us": [
                  "ESPN",
                  "ESPN EAST",
                  "ESPN HD"
              ],
              "ESPN2.us": [
                  "ESPN2",
                  "ESPN 2",
                  "ESPN2 EAST",
                  "ESPN2 HD"
              ],
              "USA.us@East": [
                  "USA NETWORK",
                  "USA NETWORK EAST",
                  "USA NETWORK EAST FEED",
                  "USA NETWORK - EAST FEED"
              ],
              "TNT.us@East": [
                  "TNT",
                  "TNT EAST",
                  "TNT EAST FEED",
                  "TNT - EASTERN FEED"
              ],
              "TBS.us@East": [
                  "TBS",
                  "TBS EAST",
                  "TBS EAST FEED",
                  "TBS - EAST"
              ],
              "FX.us@East": [
                  "FX",
                  "FX EAST",
                  "FX NETWORK",
                  "FX HD"
              ],
              "FXX.us@East": [
                  "FXX",
                  "FXX EAST",
                  "FXX EAST FEED",
                  "FXX HD"
              ],
              "ParamountNetwork.us@East": [
                  "PARAMOUNT NETWORK",
                  "PARAMOUNT NETWORK EAST",
                  "PARAMOUNT NETWORK EAST FEED",
                  "PARAMOUNT NETWORK HD"
              ],
              "SYFY.us@East": [
                  "SYFY",
                  "SYFY EAST",
                  "SYFY EAST FEED",
                  "SYFY - EASTERN FEED",
                  "SYFY HD"
              ],
              "Bravo.us@East": [
                  "BRAVO",
                  "BRAVO EAST",
                  "BRAVO EAST FEED",
                  "BRAVO - EASTERN FEED",
                  "BRAVO HD"
              ],
              "E.us@East": [
                  "E!",
                  "E! EAST",
                  "E! ENTERTAINMENT",
                  "E! ENTERTAINMENT TELEVISION",
                  "E! ENTERTAINMENT TELEVISION EAST"
              ],
              "Freeform.us@East": [
                  "FREEFORM",
                  "FREEFORM EAST",
                  "FREEFORM EAST FEED",
                  "FREEFORM HD"
              ],
              "DisneyChannel.us@East": [
                  "DISNEY CHANNEL",
                  "DISNEY CHANNEL EAST",
                  "DISNEY CHANNEL EAST FEED",
                  "DISNEY CHANNEL HD"
              ],
              "Nickelodeon.us@East": [
                  "NICKELODEON",
                  "NICKELODEON EAST",
                  "NICKELODEON EAST FEED",
                  "NICKELODEON HD"
              ],
              "CartoonNetwork.us@East": [
                  "CARTOON NETWORK",
                  "CARTOON NETWORK EAST",
                  "CARTOON NETWORK EAST FEED",
                  "CARTOON NETWORK HD"
              ],
              "ComedyCentral.us@East": [
                  "COMEDY CENTRAL",
                  "COMEDY CENTRAL EAST",
                  "COMEDY CENTRAL EAST FEED",
                  "COMEDY CENTRAL HD"
              ],
              "TCM.us@East": [
                  "TURNER CLASSIC MOVIES",
                  "TURNER CLASSIC MOVIES EAST",
                  "TURNER CLASSIC MOVIES HD",
                  "TCM",
                  "TCM EAST"
              ],
              "HallmarkChannel.us@East": [
                  "HALLMARK CHANNEL",
                  "HALLMARK CHANNEL EAST",
                  "HALLMARK CHANNEL EASTERN",
                  "HALLMARK CHANNEL HD",
                  "HALLMARK - EASTERN FEED"
              ],
              "AMC.us@East": [
                  "AMC",
                  "AMC EAST",
                  "AMC NETWORK",
                  "AMC NETWORK EAST",
                  "AMC EASTERN"
              ],
              "GameShowNetwork.us@East": [
                  "GAME SHOW NETWORK",
                  "GAME SHOW NETWORK EAST",
                  "GAME SHOW NETWORK HD",
                  "GSN",
                  "GSN EAST"
              ],
              "HGTV.us@East": [
                  "HGTV",
                  "HGTV EAST",
                  "HGTV EAST FEED",
                  "HGTV USA",
                  "HGTV USA EAST",
                  "HGTV USA EASTERN",
                  "HGTV USA EASTERN FEED",
                  "HGTV USA - EASTERN FEED",
                  "HGTV HD"
              ],
          }

          def normalize(value):
              value = value or ""
              value = value.upper()
              value = value.replace("&AMP;", "AND")
              value = re.sub(r"[^A-Z0-9!]+", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def get_names(channel):
              names = []

              for node in channel.findall("display-name"):
                  if node.text:
                      names.append(normalize(node.text))

              return names

          def score_candidate(candidate, aliases):
              channel_id = normalize(candidate["id"])
              display_names = candidate["names"]

              score = 0

              for display_name in display_names:
                  for alias in aliases:

                      if display_name == alias:
                          score = max(score, 1000)

                      elif display_name.startswith(alias + " "):
                          score = max(score, 800)

                      elif alias in display_name:
                          score = max(score, 500)

              if score == 0:
                  return 0

              combined = " ".join([channel_id] + display_names)

              # Never use another time-zone feed for an East channel.
              forbidden = [
                  "PACIFIC",
                  "WESTERN",
                  "WEST FEED",
                  "MOUNTAIN",
                  "CENTRAL FEED",
                  "MIDWEST",
              ]

              for word in forbidden:
                  if word in combined:
                      return 0

              # US2 entries in this feed are the Pacific variants
              # for the channels encountered here.
              if ".US2" in channel_id:
                  return 0

              # Never map AMC+ to AMC.
              if "AMC+" in combined or "AMC PLUS" in combined:
                  return 0

              # Prefer explicit Eastern variants.
              eastern_terms = [
                  "EASTERN",
                  "EAST",
                  "EAST FEED",
                  "EASTERN FEED",
              ]

              for term in eastern_terms:
                  if term in combined:
                      score += 300

              # The US1 source represents the Eastern/general feed.
              if ".US1" in channel_id:
                  score += 250

              # Exact national HD channels are preferable to ambiguous
              # local/affiliate listings.
              if "HD" in combined:
                  score += 25

              return score

          with gzip.open(SOURCE, "rb") as f:
              tree = ET.parse(f)

          root = tree.getroot()

          source_channels = []

          for channel in root.findall("channel"):
              source_channels.append({
                  "element": channel,
                  "id": channel.get("id", ""),
                  "names": get_names(channel)
              })

          selected = {}
          used_source_ids = set()

          for target_id, alias_list in channels.items():
              aliases = [normalize(alias) for alias in alias_list]

              best = None
              best_score = 0

              for candidate in source_channels:
                  if candidate["id"] in used_source_ids:
                      continue

                  score = score_candidate(candidate, aliases)

                  if score > best_score:
                      best_score = score
                      best = candidate

              if best is not None and best_score > 0:
                  selected[target_id] = best
                  used_source_ids.add(best["id"])

          print()
          print("Requested channels:", len(channels))
          print("Matched channels:", len(selected))
          print()

          for target_id in channels:
              if target_id in selected:
                  candidate = selected[target_id]

                  print(
                      "MATCH:",
                      target_id,
                      "<-",
                      candidate["id"],
                      "|",
                      " / ".join(candidate["names"])
                  )
              else:
                  print("MISSING:", target_id)

          missing = [
              target_id
              for target_id in channels
              if target_id not in selected
          ]

          if missing:
              print()
              print("ERROR: The following channels could not be matched:")
              for channel_id in missing:
                  print("  " + channel_id)

              raise SystemExit(1)

          # Remove all channels that aren't part of the playlist.
          selected_elements = {
              id(candidate["element"])
              for candidate in selected.values()
          }

          for channel in list(root.findall("channel")):
              if id(channel) not in selected_elements:
                  root.remove(channel)

          # Change the selected EPG IDs to exactly match channels.m3u.
          source_to_target = {}

          for target_id, candidate in selected.items():
              source_id = candidate["id"]

              candidate["element"].set("id", target_id)

              source_to_target[source_id] = target_id

          # Keep only programmes belonging to our selected channels
          # and rewrite their channel IDs.
          programme_count = 0

          for programme in list(root.findall("programme")):
              source_id = programme.get("channel")

              if source_id in source_to_target:
                  programme.set(
                      "channel",
                      source_to_target[source_id]
                  )

                  programme_count += 1
              else:
                  root.remove(programme)

          print()
          print("Programme entries:", programme_count)

          if programme_count == 0:
              raise SystemExit(
                  "ERROR: No programme entries were found."
              )

          tree.write(
              OUTPUT,
              encoding="utf-8",
              xml_declaration=True
          )

          print()
          print("Created:", OUTPUT)
          PY

      - name: Validate EPG
        run: |
          test -s public/guide.xml

          if ! grep -q "<tv" public/guide.xml; then
            echo "ERROR: guide.xml is not a valid XMLTV document."
            exit 1
          fi

          PROGRAM_COUNT=$(grep -c "<programme " public/guide.xml || true)

          echo "EPG programme entries: $PROGRAM_COUNT"

          if [ "$PROGRAM_COUNT" -lt 1 ]; then
            echo "ERROR: guide.xml contains no programme entries."
            exit 1
          fi

      - name: Copy playlist
        run: |
          if [ ! -f channels.m3u ]; then
            echo "ERROR: channels.m3u was not found."
            exit 1
          fi

          cp channels.m3u public/channels.m3u

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lh public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
