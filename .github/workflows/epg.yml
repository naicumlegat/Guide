          }
          id_aliases = {
              "USA.us@East": [
                  "USA.us@East",
                  "USANetwork.us@East",
              ],
          }
          def parse_m3u(path):
              entries = []
              lines = open(
                  path,
                  encoding="utf-8",
                  errors="ignore"
              ).read().splitlines()
              for i, line in enumerate(lines):
                  if not line.startswith("#EXTINF"):
                      continue
                  match = re.search(
                      r'tvg-id="([^"]*)"',
                      line
                  )
                  name_match = re.search(
                      r',(.+)$',
                      line
                  )
                  if i + 1 >= len(lines):
                      continue
                  url = lines[i + 1].strip()
                  if not url.startswith(("http://", "https://")):
                      continue
                  tvg_id = match.group(1) if match else ""
                  name = name_match.group(1).strip() if name_match else ""
                  entries.append({
                      "id": tvg_id,
                      "name": name,
                      "url": url,
                  })
              return entries
          current_entries = parse_m3u("current-us.m3u")
          ny_entries = parse_m3u("new-york.m3u")
          boston_entries = parse_m3u("boston.m3u")
          def local_matches(entries, channel_name):
              result = []
              wanted = channel_name.lower()
              for entry in entries:
                  text = (
                      entry["id"] + " " + entry["name"]
                  ).lower()
                  if wanted == "abc":
                      if "abc" in text:
                          result.append(entry["url"])
                  elif wanted == "cbs":
                      if "cbs" in text:
                          result.append(entry["url"])
                  elif wanted == "nbc":
                      if "nbc" in text:
                          result.append(entry["url"])
                  elif wanted == "fox":
                      if "fox" in text:
                          result.append(entry["url"])
                  elif wanted == "the cw":
                      if (
                          "cw" in text
                          or "the cw" in text
                      ):
                          result.append(entry["url"])
              return result
          def test_url(url):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                              "Mozilla/5.0 "
                              "(Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 "
                              "(KHTML, like Gecko) "
                              "Chrome/131.0 Safari/537.36",
                          "Accept":
                              "*/*",
                          "Connection":
                              "close",
                      }
                  )
                  with urllib.request.urlopen(
                      request,
                      timeout=10
                  ) as response:
                      status = response.status
                      if status < 200 or status >= 400:
                          return False
                      content_type = (
                          response.headers.get(
                              "Content-Type",
                              ""
                          ).lower()
                      )
                      data = response.read(8192)
                      text = data.decode(
                          "utf-8",
                          errors="ignore"
                      )
                      # Real HLS playlist.
                      if (
                          "#EXTM3U" in text
                          or "#EXT-X-" in text
                      ):
                          return True
                      # MPEG-TS/raw video endpoints can legitimately
                      # return binary data rather than an HLS manifest.
                      if any(
                          value in content_type
                          for value in [
                              "video/",
                              "mpeg",
                              "octet-stream",
                          ]
                      ):
                          return True
                      return False
              except Exception:
                  return False
          # Build candidates.
          candidates = {}
          for tvg_id, group, name, fallback in channels:
              # FROZEN channels are NEVER tested/replaced.
              if tvg_id in FROZEN:
                  candidates[tvg_id] = [fallback]
                  continue
              found = []
              # Explicit alternatives first.
              found.extend(
                  alternatives.get(tvg_id, [])
              )
              # NYC first, then Boston, for local networks.
              if name in {
                  "ABC",
                  "CBS",
                  "NBC",
                  "FOX",
                  "The CW",
              }:
                  found.extend(
                      local_matches(
                          ny_entries,
                          name
                      )
                  )
                  found.extend(
                      local_matches(
                          boston_entries,
                          name
                      )
                  )
              # Current IPTV-org exact ID candidates.
              ids = id_aliases.get(
                  tvg_id,
                  [tvg_id]
              )
              for entry in current_entries:
                  if entry["id"] in ids:
                      found.append(entry["url"])
              # Original fallback last.
              found.append(fallback)
              candidates[tvg_id] = list(
                  dict.fromkeys(found)
              )
          selected = {}
          # Only broken/non-frozen channels are tested.
          tests = {}
          with concurrent.futures.ThreadPoolExecutor(
              max_workers=24
          ) as executor:
              for tvg_id, urls in candidates.items():
                  if tvg_id in FROZEN:
                      continue
                  for url in urls:
                      tests[
                          (tvg_id, url)
                      ] = executor.submit(
                          test_url,
                          url
                      )
              for tvg_id, urls in candidates.items():
                  if tvg_id in FROZEN:
                      selected[tvg_id] = urls[0]
                      continue
                  for url in urls:
                      try:
                          if tests[
                              (tvg_id, url)
                          ].result():
                              selected[tvg_id] = url
                              break
                      except Exception:
                          pass
          # Absolute safety fallback.
          for tvg_id, group, name, fallback in channels:
              if tvg_id not in selected:
                  selected[tvg_id] = fallback
          with open(
              "public/channels.m3u",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("#EXTM3U\n\n")
              for tvg_id, group, name, fallback in channels:
                  url = selected[tvg_id]
                  f.write(
                      f'#EXTINF:-1 tvg-id="{tvg_id}" '
                      f'group-title="{group}",{name}\n'
                  )
                  f.write(url + "\n\n")
          print()
          print("========================================")
          print("FINAL STREAM SELECTION")
          print("========================================")
          print()
          for tvg_id, group, name, fallback in channels:
              url = selected[tvg_id]
              if tvg_id in FROZEN:
                  print(
                      f"FROZEN:   {name}"
                  )
                  print(
                      f"          {url}"
                  )
              elif url == fallback:
                  print(
                      f"FALLBACK: {name}"
                  )
                  print(
                      f"          {url}"
                  )
              else:
                  print(
                      f"REPLACED: {name}"
                  )
                  print(
                      f"          {url}"
                  )
          print()
          print(
              "Playlist channels:",
              len(channels)
          )
          PY
      - name: Download current US EPG
        run: |
          curl -L --fail \
            "https://vcicio.github.io/US-EPG/merged_epg.xml.gz" \
            -o epg.xml.gz
          test -s epg.xml.gz
          ls -lh epg.xml.gz
      - name: Build filtered EPG
        run: |
          python <<'PY'
          import gzip
          import re
          import xml.etree.ElementTree as ET
          SOURCE = "epg.xml.gz"
          OUTPUT = "public/guide.xml"
          channels = {
              "ABC.us@East": ["ABC"],
              "CBS.us@East": ["CBS"],
              "NBC.us@East": ["NBC"],
              "Fox.us@East": ["FOX"],
              "TheCW.us@SD": ["THE CW", "CW"],
              "PBS.us@KQED": ["PBS"],
              "CNN.us@East": ["CNN"],
              "FoxNewsChannel.us@SD": ["FOX NEWS", "FOX NEWS CHANNEL"],
              "CNBC.us@East": ["CNBC"],
              "ESPN.us": ["ESPN"],
              "ESPN2.us": ["ESPN2", "ESPN 2"],
              "USA.us@East": ["USA NETWORK"],
              "TNT.us@East": ["TNT"],
              "TBS.us@East": ["TBS"],
              "FX.us@East": ["FX"],
              "FXX.us@East": ["FXX"],
              "ParamountNetwork.us@East": ["PARAMOUNT NETWORK"],
              "SYFY.us@East": ["SYFY"],
              "Bravo.us@East": ["BRAVO"],
              "E.us@East": ["E!"],
              "Freeform.us@East": ["FREEFORM"],
              "DisneyChannel.us@East": ["DISNEY CHANNEL"],
              "Nickelodeon.us@East": ["NICKELODEON"],
              "CartoonNetwork.us@East": ["CARTOON NETWORK"],
              "ComedyCentral.us@East": ["COMEDY CENTRAL"],
              "TCM.us@East": ["TURNER CLASSIC MOVIES", "TCM"],
              "HallmarkChannel.us@East": ["HALLMARK CHANNEL", "HALLMARK"],
              "AMC.us@East": ["AMC"],
              "GameShowNetwork.us@East": ["GAME SHOW NETWORK", "GSN"],
              "HGTV.us@East": ["HGTV"],
          }
          def normalize(value):
              value = value or ""
              value = value.upper()
              value = value.replace("&AMP;", "AND")
              value = re.sub(
                  r"[^A-Z0-9!]+",
                  " ",
                  value
              )
              return re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()
          def get_names(channel):
              return [
                  normalize(node.text)
                  for node in channel.findall(
                      "display-name"
                  )
                  if node.text
              ]
          def score_candidate(candidate, aliases):
              channel_id = normalize(
                  candidate["id"]
              )
              names = candidate["names"]
              combined = " ".join(
                  [channel_id] + names
              )
              forbidden = [
                  "PACIFIC",
                  "WESTERN",
                  "WEST FEED",
                  "MOUNTAIN",
                  "CENTRAL FEED",
                  "MIDWEST",
              ]
              if any(
                  word in combined
                  for word in forbidden
              ):
                  return 0
              if re.search(
                  r"\bUS2\b",
                  channel_id
              ):
                  return 0
              if (
                  "AMC+" in combined
                  or "AMC PLUS" in combined
              ):
                  return 0
              score = 0
              for name in names:
                  for alias in aliases:
                      if name == alias:
                          score = max(
                              score,
                              1000
                          )
                      elif name.startswith(
                          alias + " "
                      ):
                          score = max(
                              score,
                              800
                          )
                      elif alias in name:
                          score = max(
                              score,
                              500
                          )
              if score == 0:
                  return 0
              if any(
                  x in combined
                  for x in [
                      "EASTERN",
                      "EAST",
                      "EAST FEED",
                  ]
              ):
                  score += 300
              if re.search(
                  r"\bUS1\b",
                  channel_id
              ):
                  score += 250
              return score
          with gzip.open(
              SOURCE,
              "rb"
          ) as f:
              tree = ET.parse(f)
          root = tree.getroot()
          source_channels = []
          for channel in root.findall(
              "channel"
          ):
              source_channels.append({
                  "element": channel,
                  "id": channel.get(
                      "id",
                      ""
                  ),
                  "names": get_names(
                      channel
                  )
              })
          selected = {}
          used_source_ids = set()
          for target_id, aliases in channels.items():
              aliases = [
                  normalize(x)
                  for x in aliases
              ]
              best = None
              best_score = 0
              for candidate in source_channels:
                  if candidate["id"] in used_source_ids:
                      continue
                  score = score_candidate(
                      candidate,
                      aliases
                  )
                  if score > best_score:
                      best_score = score
                      best = candidate
              if best is not None:
                  selected[target_id] = best
                  used_source_ids.add(
                      best["id"]
                  )
          print()
          print(
              "Requested channels:",
              len(channels)
          )
          print(
              "Matched EPG channels:",
              len(selected)
          )
          print()
          for target_id in channels:
              if target_id in selected:
                  candidate = selected[
                      target_id
                  ]
                  print(
                      "MATCH:",
                      target_id,
                      "<-",
                      candidate["id"],
                      "|",
                      " / ".join(
                          candidate["names"]
                      )
                  )
              else:
                  print(
                      "SKIP:",
                      target_id
                  )
          selected_elements = {
              id(candidate["element"])
              for candidate in selected.values()
          }
          for channel in list(
              root.findall("channel")
          ):
              if id(channel) not in selected_elements:
                  root.remove(channel)
          source_to_target = {}
          for target_id, candidate in selected.items():
              source_id = candidate["id"]
              candidate["element"].set(
                  "id",
                  target_id
              )
              source_to_target[
                  source_id
              ] = target_id
          programme_count = 0
          for programme in list(
              root.findall("programme")
          ):
              source_id = programme.get(
                  "channel"
              )
              if source_id in source_to_target:
                  programme.set(
                      "channel",
                      source_to_target[
                          source_id
                      ]
                  )
                  programme_count += 1
              else:
                  root.remove(programme)
          print()
          print(
              "Final matched channels:",
              len(selected)
          )
          print(
              "Programme entries:",
              programme_count
          )
          if not selected:
              raise SystemExit(
                  "ERROR: No EPG channels were matched."
              )
          if programme_count == 0:
              raise SystemExit(
                  "ERROR: No programme entries were found."
              )
          tree.write(
              OUTPUT,
              encoding="utf-8",
              xml_declaration=True
          )
          print()
          print(
              "Created:",
              OUTPUT
          )
          PY
      - name: Validate generated files
        run: |
          test -s public/channels.m3u
          test -s public/guide.xml
          CHANNEL_COUNT=$(grep -c '^#EXTINF' public/channels.m3u || true)
          PROGRAM_COUNT=$(grep -c '<programme ' public/guide.xml || true)
          echo "Playlist channels: $CHANNEL_COUNT"
          echo "EPG programmes: $PROGRAM_COUNT"
          if [ "$CHANNEL_COUNT" -ne 30 ]; then
            echo "ERROR: Expected 30 playlist channels."
            exit 1
          fi
          if ! grep -q '<tv' public/guide.xml; then
            echo "ERROR: guide.xml is not valid XMLTV."
            exit 1
          fi
          if [ "$PROGRAM_COUNT" -lt 1 ]; then
            echo "ERROR: guide.xml contains no programmes."
            exit 1
          fi
      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lh public/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
